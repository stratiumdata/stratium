name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

# The build, test, vet, and lint jobs call `make` rather than `go` directly.
# That is not tidiness: as of Phase 14 Task 6 the admin UI (clients/ui) is
# embedded into cmd/stratium-pap with //go:embed dist, and dist/ is a
# git-ignored build output. Every command that COMPILES that package -- go
# build, go vet, go test, and golangci-lint alike -- fails on a fresh checkout
# with "pattern dist: no matching files found" until the UI has been built.
#
# The Makefile owns that ordering (`build`, `test`, `vet`, and `lint` all
# depend on `ui`), so calling the same targets here keeps one definition of it
# instead of two that can drift. It also means N13's "the UI's build, lint,
# and tests join the standard gate" is true of CI and of a developer's
# machine in the same way, by the same targets.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      - run: make build

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      # `make test` runs the Go race suite AND the admin UI's own eslint and
      # vitest runs (the ui-test target). A UI that stopped compiling, or a
      # test that started failing, fails this job -- N13's "an unexercised
      # thing is a broken thing".
      - run: make test

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      # The make target vets both build configurations: untagged, and with
      # -tags integration, which is the only way the integration test files
      # are type-checked at all outside a run of `make integration`.
      - run: make vet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      # golangci-lint compiles cmd/stratium-pap, so it needs dist/ to exist
      # exactly as much as `go build` does. The action installs the linter and
      # caches it; `make ui` before it supplies the embed target.
      - run: make ui
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
          working-directory: services

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action. The action calls GET /users/{owner}
      # and exits 1 before scanning if the owner is a GitHub Organization and
      # GITLEAKS_LICENSE is unset — the gate would fail on every run of an
      # org-owned repo. The CLI itself is MIT-licensed with no such gate.
      - name: gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact --verbose .
        env:
          GITLEAKS_VERSION: "8.24.3"

  conformance:
    name: Authorization conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      # No setup-node here, and no `ui` prerequisite on the conformance
      # target: it runs only ./internal/authz, which is pure and does not
      # import cmd/stratium-pap, so nothing in this job compiles the embed.
      #
      # Pattern must include TestConformanceSuiteIsComplete, which fails if any
      # property was deleted or renamed. Filtering to TestC[0-9] alone excludes it,
      # and the job then passes green even with the whole suite removed.
      # Delegates to the Makefile target, which asserts the property COUNT.
      # Running go test directly is not enough: if conformance_test.go is deleted,
      # -run matches nothing and go test exits 0 with "no tests to run".
      - run: make conformance
