name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - working-directory: services
        run: go build ./...

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - working-directory: services
        run: go test -race ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - working-directory: services
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
          working-directory: services

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action. The action calls GET /users/{owner}
      # and exits 1 before scanning if the owner is a GitHub Organization and
      # GITLEAKS_LICENSE is unset — the gate would fail on every run of an
      # org-owned repo. The CLI itself is MIT-licensed with no such gate.
      - name: gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact --verbose .
        env:
          GITLEAKS_VERSION: "8.24.3"

  conformance:
    name: Authorization conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - working-directory: services
        # Pattern must include TestConformanceSuiteIsComplete, which fails if any
        # property was deleted or renamed. Filtering to TestC[0-9] alone excludes it,
        # and the job then passes green even with the whole suite removed.
        # Delegates to the Makefile target, which asserts the property COUNT.
        # Running go test directly is not enough: if conformance_test.go is deleted,
        # -run matches nothing and go test exits 0 with "no tests to run".
        working-directory: .
        run: make conformance
