# The workflows name Actions by commit and the Docker files name images by
# digest, so neither moves on its own. This opens the pull requests that
# move them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images and the compose file's images.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # Postgres 18 refuses the data volume as the compose file mounts it. A
      # new major version is a change to the stack, made by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Named by digest with no tag, so an update follows wherever the default
      # tag points, which can be an older release. The compose file says how
      # this digest is chosen.
      - dependency-name: berriai/litellm
