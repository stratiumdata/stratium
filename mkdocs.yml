site_name: Stratium
site_description: Per-tool-call authorization for AI agents.
site_url: https://docs.stratium.dev/
repo_url: https://github.com/stratiumdata/stratium
repo_name: stratiumdata/stratium
edit_uri: edit/main/docs/
copyright: Apache-2.0 · <a href="https://stratium.dev">stratium.dev</a>

docs_dir: docs
# Internal engineering documents: design specs, AI planning notes, and the
# pre-launch validation checklist (whose tests point at it by path). Links to
# them are rewritten to GitHub by the hook below rather than published here.
exclude_docs: |
  superpowers/
  validation-journeys.md

hooks:
  - .mkdocs/hooks.py

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so in-doc links work both on GitHub and here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Concepts:
      - The concepts: concepts.md
      - Glossary: glossary.md
  - User journeys:
      - journeys/index.md
      - Your first governed agent: journeys/first-agent.md
      - Understand a denial: journeys/understand-a-denial.md
      - Keep an agent in its workspace: journeys/workspace-scope.md
      - Protect sensitive data: journeys/sensitive-data.md
      - Require approval: journeys/require-approval.md
      - Hand a sub-agent less: journeys/sub-agents.md
      - Govern a tool server: journeys/tool-server.md
      - Review a change: journeys/review-a-change.md
      - Stop an agent now: journeys/stop-an-agent.md
      - Investigate what an agent did: journeys/investigate.md
  - Get started:
      - Quickstart: quickstart.md
      - A default posture: default-posture.md
  - Operate:
      - User guide: user-guide.md
      - Release notes:
          - Sender-constrained tokens (DPoP): releases/2026-08-17-sender-constrained-tokens.md
  - Enforcement (PEP):
      - pep/README.md
      - Installing stratium-pep: pep.md
      - session-start: pep/session-start.md
      - hook: pep/hook.md
      - Antigravity CLI: pep/harnesses/antigravity.md
      - Copilot CLI: pep/harnesses/copilot.md
      - Cursor: pep/harnesses/cursor.md
      - Devin: pep/harnesses/devin.md
      - Goose: pep/harnesses/goose.md
      - Kiro CLI: pep/harnesses/kiro.md
      - OpenCode: pep/harnesses/opencode.md
      - mcp: pep/mcp.md
      - proxy: pep/proxy.md
      - extauthz: pep/extauthz.md
  - Architecture:
      - Technical walkthrough: architecture.md
  - Testing:
      - Testing against a real agent: testing/2026-08-20-agent-integration-test.md
      - Resource labelling test plan: testing/2026-08-19-resource-labelling-manual-test.md
