name: Publish @stratium/claude-hooks

# Triggers:
#   - Manual: Actions tab → Run workflow (choose target registry)
#   - Auto: on GitHub Release (tag: v*)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: 'Target registry'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - public
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        working-directory: sdk/claude-hooks
        run: node --test test/

  publish:
    name: Publish to npm registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure registry
        working-directory: sdk/claude-hooks
        env:
          REGISTRY_TYPE: ${{ github.event.inputs.registry || 'private' }}
          PRIVATE_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://npm.corp.com' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$REGISTRY_TYPE" = "public" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' \
              "$NPM_TOKEN" > .npmrc
          else
            REGISTRY_HOST=$(printf '%s' "$PRIVATE_REGISTRY" | sed 's|https\?://||')
            printf 'registry=%s/\n//%s/:_authToken=%s\nalways-auth=true\n' \
              "$PRIVATE_REGISTRY" "$REGISTRY_HOST" "$NPM_TOKEN" > .npmrc
          fi

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        working-directory: sdk/claude-hooks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: sdk/claude-hooks
        run: npm publish --dry-run

      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: sdk/claude-hooks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance

      - name: Post-publish verification
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: sdk/claude-hooks
        env:
          REGISTRY_TYPE: ${{ github.event.inputs.registry || 'private' }}
          PRIVATE_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://npm.corp.com' }}
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$REGISTRY_TYPE" = "public" ]; then
            npm view "@stratium/claude-hooks@$PKG_VERSION" version
          else
            npm view "@stratium/claude-hooks@$PKG_VERSION" version \
              --registry "$PRIVATE_REGISTRY"
          fi
          echo "Published @stratium/claude-hooks@$PKG_VERSION"
