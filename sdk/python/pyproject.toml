[project]
name = "stratium-sdk"
version = "0.1.0"
description = "Build a Stratium policy enforcement point"
requires-python = ">=3.12"
license = "Apache-2.0"
# Floors match the generated code in stratium/_pdp, which checks them at
# import: pdp_pb2.py needs protobuf 7.35.1+ within major 7, and
# pdp_pb2_grpc.py needs grpcio 1.83.0+. Raise them when regenerating.
dependencies = ["grpcio>=1.83.0", "protobuf>=7.35.1,<8"]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.83.0", "pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stratium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
