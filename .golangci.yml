version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # an ignored error on a decision path is a security bug
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - nilerr          # returning nil after a non-nil error is fail-open in disguise
    - rowserrcheck
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [stratium]
