version: "2"

run:
  # Without this, golangci-lint parses no file behind a build tag -- and every
  # live-Postgres proof in this repo sits behind `//go:build integration`.
  # 19 files, analysed by zero linters, while `make lint` reported 0 issues.
  # Tags are additive, so untagged files stay covered by the same invocation.
  build-tags:
    - integration
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # an ignored error on a decision path is a security bug
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - nilerr          # returning nil after a non-nil error is fail-open in disguise
    - rowserrcheck
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/stratiumdata/stratium]
