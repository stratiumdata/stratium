<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#000; stroke-width:2; }
      .line { fill:none; stroke:#000; stroke-width:2; marker-end:url(#arrow); }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:28px; font-weight:bold; }
      .label { font-family:Arial, Helvetica, sans-serif; font-size:18px; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:16px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1040" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">FIG. 5 — Dynamic Narrowing and Revocation Workflow</text>

  <rect class="box" x="360" y="100" width="480" height="80"/>
  <text x="600" y="146" text-anchor="middle" class="label">Active delegation artifact in use</text>

  <rect class="box" x="360" y="230" width="480" height="80"/>
  <text x="600" y="276" text-anchor="middle" class="label">Monitor runtime signals</text>

  <polygon class="box" points="600,360 760,450 600,540 440,450"/>
  <text x="600" y="456" text-anchor="middle" class="label">Risk or policy</text>
  <text x="600" y="482" text-anchor="middle" class="label">event?</text>

  <rect class="box" x="130" y="410" width="210" height="80"/>
  <text x="235" y="456" text-anchor="middle" class="label">Continue execution</text>

  <rect class="box" x="820" y="410" width="260" height="80"/>
  <text x="950" y="446" text-anchor="middle" class="label">Compute narrow or revoke</text>
  <text x="950" y="472" text-anchor="middle" class="label">decision</text>

  <polygon class="box" points="950,560 1080,635 950,710 820,635"/>
  <text x="950" y="642" text-anchor="middle" class="label">Narrow or revoke?</text>

  <rect class="box" x="810" y="760" width="280" height="75"/>
  <text x="950" y="804" text-anchor="middle" class="label">Update artifact state</text>

  <rect class="box" x="170" y="760" width="280" height="75"/>
  <text x="310" y="792" text-anchor="middle" class="label">Propagate status to gateway</text>
  <text x="310" y="818" text-anchor="middle" class="label">and child delegations</text>

  <rect class="box" x="170" y="900" width="280" height="75"/>
  <text x="310" y="944" text-anchor="middle" class="label">Block or constrain future</text>
  <text x="310" y="970" text-anchor="middle" class="label">actions</text>

  <rect class="box" x="810" y="900" width="280" height="75"/>
  <text x="950" y="944" text-anchor="middle" class="label">Record narrowing or</text>
  <text x="950" y="970" text-anchor="middle" class="label">revocation event</text>

  <line class="line" x1="600" y1="180" x2="600" y2="230"/>
  <line class="line" x1="600" y1="310" x2="600" y2="360"/>
  <line class="line" x1="440" y1="450" x2="340" y2="450"/>
  <text x="395" y="438" text-anchor="middle" class="small">No</text>

  <path class="line" d="M 235 410 L 235 350 L 420 350"/>
  <text x="225" y="336" class="small">Loop</text>

  <line class="line" x1="760" y1="450" x2="820" y2="450"/>
  <text x="790" y="438" text-anchor="middle" class="small">Yes</text>

  <line class="line" x1="950" y1="490" x2="950" y2="560"/>
  <line class="line" x1="950" y1="710" x2="950" y2="760"/>
  <line class="line" x1="810" y1="797" x2="450" y2="797"/>
  <line class="line" x1="310" y1="835" x2="310" y2="900"/>
  <line class="line" x1="950" y1="835" x2="950" y2="900"/>
</svg>
