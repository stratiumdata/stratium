// Package stratium.pdp.v1 is the PDP's external contract: one RPC, Decide,
// that turns a request into a compound authorization decision.
//
// See services/internal/authz for the pure decision function this wraps, and
// services/internal/pdpgrpc for the server that implements this service.
syntax = "proto3";

package stratium.pdp.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stratiumdata/stratium/internal/pdpgrpc;pdpgrpc";

// Effect mirrors internal/authz.Effect. EFFECT_DENY is deliberately the zero
// value, not EFFECT_UNSPECIFIED as typical proto3 style would put there: an
// Effect field that is never set, or that decodes from a truncated/corrupt
// message, must come back DENY, not silently ALLOW. This is the same
// invariant internal/authz.Effect documents for the Go type ("a leg that is
// never evaluated must deny rather than silently permit") — the wire format
// carries it through rather than reopening the gap at the boundary.
enum Effect {
  EFFECT_DENY = 0;
  EFFECT_ALLOW = 1;
  EFFECT_ESCALATE = 2;
}

// DecideRequest is everything the PDP needs from a caller to compute a
// decision for one action.
//
// Two things are deliberately absent from this message, and must stay
// absent:
//
//   - A tenant identifier. The tenant is startup configuration
//     (internal/config.Config.TenantID), fixed for the PDP's lifetime and
//     never taken from a request field. The predecessor system trusted a
//     client-supplied identity header (x-user-id) to select the tenant, and
//     that was a critical authentication bypass — any caller could name any
//     tenant simply by setting the header. A tenant field here would
//     reintroduce that exact defect over gRPC instead of HTTP.
//   - A principal decision. Evaluating the principal leg is the server's
//     job: it calls internal/policy.PrincipalPolicy itself, inside Decide,
//     using the identity gRPC's transport authenticated (Phase 2 adds
//     mTLS/OIDC for that; Phase 1c has no caller-verified identity at all,
//     which is exactly why nothing here lets a caller assert one). A field
//     carrying a caller-supplied verdict would let any caller hand the PDP
//     its own answer and have the PDP rubber-stamp it — the same class of
//     defect as the tenant header, aimed at authorization instead of
//     authentication.
message DecideRequest {
  // delegation_id is retired (spec §4.7.1 K4, Phase 9 Task 3): a bare,
  // caller-supplied delegation id authenticates nothing. Under A1/E7 the PDP
  // verifies no caller identity at the transport layer, so accepting an id
  // straight off the wire and trusting it is exactly as strong as accepting
  // no credential at all -- an attacker (A10) simply omits whatever a token
  // would have been and sends the id instead. token, below, replaced it.
  // Reserved, not reused, for the same reason fields 5/9 below are: a caller
  // still built against the old contract must fail to decode this field
  // rather than have it silently reinterpreted as a token string -- field 1
  // and field 11 (token) are both plain strings, so reusing the number here
  // is the one substitution the wire format itself could not catch.
  reserved 1;
  reserved "delegation_id";

  // agent_id is the acting agent's registry ID. A UUID string.
  string agent_id = 2;

  // subject identifies the principal on whose behalf the agent acts.
  string subject = 3;

  string tool = 4;

  // Fields 5 (verb) and 9 (normalized_input) were retired together (spec
  // §4.4.2 T3): both were a PEP-side guess -- cmd/stratium-pep's now-deleted
  // toolVerbs and normalizedInputFields tables -- derived from Claude Code's
  // own tool names and field shapes, in a message meant to serve any agent
  // framework, and neither guess was verifiable by the PDP that received it.
  // The per-tenant tool_catalog table (migrations/000013_tool_catalog) now
  // holds both per tool, and internal/authz.ExtractFromCatalog /
  // ApplyExtraction derive them server-side from a call's own raw_input and
  // the tenant's own row -- the PDP's own reading, not a caller's claim.
  // Reserved, not reused: a caller still built against the old contract must
  // fail to decode field 5 or 9 rather than have either silently
  // reinterpreted as whatever a future field puts there.
  reserved 5, 9;
  reserved "verb", "normalized_input";

  string raw_input = 6;

  // declared_tier is the caller's claimed action tier. It is optional so
  // "the caller did not declare a tier" is distinguishable from "the caller
  // declared REASONING": REASONING is tier zero, a real, meaningful tier
  // (internal/authz never derives from this value — it is only cross-checked
  // against the tier the server derives itself), and collapsing "absent"
  // into that zero would silently turn a client that never set this field
  // into one asserting the lowest-sensitivity tier there is.
  optional int32 declared_tier = 7;

  // resource carries attributes the delegation-scope checks read: the
  // resource's IDENTITY, and any other opaque key a delegation's
  // resource_constraints might name. Caller-supplied and untrusted like every
  // other field here. Neither PEP in this repo populates this anymore:
  // cmd/stratium-pep sends only tool and raw_input (spec §4.4.2 T3) and
  // leaves this field unset. A cataloged tool's resource identity is
  // extracted server-side instead, from raw_input, by
  // internal/authz.ExtractFromCatalog, which replaces whatever this field
  // carries; an uncataloged tool passes it through unchanged, which for
  // every caller in this repo today is simply empty. The field itself stays
  // on the contract for a caller this repo does not control that has a real,
  // externally-verified resource identity to assert.
  //
  // Two keys are NOT read from here and are discarded before any leg sees
  // them: "classification" and "hierarchy". The PDP resolves both from the
  // tenant's own resource_label_rules (spec §3.9.1 R4,
  // internal/pdpgrpc/label.go), because a classification is a
  // security-relevant fact the server cannot check a caller's word on —
  // spec §3.9 R1, the same ruling that keeps every PEP in this repo from
  // sending one. An earlier version of this comment said the map could only
  // narrow what a delegation permits; that stopped being true when R2 made
  // an unlabelled resource DENY, since a claimed low classification would
  // then have turned a denial into an allow.
  map<string, string> resource = 8;

  // approval_id, when set, names a pending approval this call should
  // consume rather than create: the retry sent after a prior call returned
  // EFFECT_ESCALATE with one. Optional for the same reason declared_tier
  // above is — "the caller is retrying with an approval to offer" must stay
  // distinguishable from "the caller is asking fresh," and a UUID-shaped
  // field cannot borrow parent_delegation_id's plain-string convention
  // (CreateDelegationRequest, below) to make that distinction, because an
  // explicitly-sent empty string here is a caller bug (meant to retry,
  // forgot to attach the id) worth its own InvalidArgument rather than
  // silent reinterpretation as "no approval, evaluate fresh" — which would
  // hide that bug behind a second, unwanted pending approval instead.
  optional string approval_id = 10;

  // token is a signed credential (internal/token.Signer, spec §4.7.1 K1)
  // naming the acting delegation -- the caller's ONLY way to identify one,
  // now that delegation_id is gone (K4). Decide verifies it (signature
  // against the current or previous key, not expired, well-formed) and
  // reads the delegation id it names from the token's own "sub" claim; it
  // never reads a delegation id from anywhere else on this message.
  //
  // A token is an authenticated REFERENCE, never a capability (K3): it
  // carries no scope of its own (see internal/pdpgrpc's tokenClaims, which
  // deliberately excludes every scope field), so verifying one buys
  // authentication only -- Decide still loads the delegation it names and
  // evaluates all three legs exactly as it would have from a bare id,
  // including denying a since-revoked or since-expired row. A plain,
  // required string, not optional like approval_id above: unlike "the
  // caller is retrying with an approval to offer," there is no legitimate
  // "caller is asking fresh, no token needed" case for presence-tracking to
  // distinguish from an explicitly-empty one -- both an absent and an
  // empty token are simply invalid, and Decide denies either the same way,
  // with no fallback (K4).
  string token = 11;

  // dpop_proof is the RFC 9449 DPoP proof JWT the caller presented, forwarded
  // verbatim by the PEP (spec §4.7.2 K7). Empty when the caller presented
  // none.
  //
  // The PDP verifies it, never the PEP (K2, D1): the signature against the
  // key the proof's own header carries, freshness against the configured
  // window (K9), the thumbprint of that key against the presented token's
  // cnf.jkt, htm/htu against observed_method/observed_uri below, and
  // single-use of its jti (K8). Splitting any of that out to the PEP would
  // put half of "is this credential genuine" outside the PDP, and a PEP that
  // decides a proof is valid is a PEP making an authorization decision.
  //
  // A plain string, not optional, matching token above: an absent proof and
  // an explicitly-empty one are the same fact — the caller presented none —
  // and the PDP treats them identically, so there is no presence to track.
  // Never copied into raw_input and never written to the audit chain (K10).
  string dpop_proof = 12;

  // observed_method and observed_uri are the HTTP method and target URI the
  // ENFORCEMENT SURFACE saw, never anything the caller asserted about its own
  // request (K7). A DPoP proof binds to an HTTP request through its htm and
  // htu claims, and the PDP never sees that request — it sees this Decide
  // call — so the PEP has to report the pair, exactly as it already
  // serializes raw_input on the caller's behalf.
  //
  // On the gRPC proxy surface that pair is the PROXY's own address plus the
  // full method path, "/package.Service/Method", with observed_method "POST"
  // (gRPC is HTTP/2 POST) — what the agent addressed and what the PEP
  // observes. Reporting the TARGET's address instead would let a proof minted
  // for one target be replayed at another behind the same proxy.
  //
  // Both are ignored entirely when dpop_proof is empty, and neither is a
  // trusted input even when it is not: they can only ever NARROW what a proof
  // satisfies. A surface that reported the wrong pair denies its own traffic;
  // it cannot make a proof minted for somewhere else pass, because htm/htu
  // are covered by the proof's signature and the comparison is equality
  // against a value the surface — not the presenter — supplies.
  string observed_method = 13;
  string observed_uri = 14;
}

// DecideResponse is the compound decision and each leg's individual
// contribution to it, so a caller (and the audit trail) can see not just the
// outcome but why.
message DecideResponse {
  Effect effect = 1;
  int32 derived_tier = 2;

  Effect principal_effect = 3;
  string principal_reason = 4;

  Effect agent_effect = 5;
  string agent_reason = 6;

  Effect delegation_effect = 7;
  string delegation_reason = 8;

  // denied_leg names which leg produced the denial: "principal", "agent", or
  // "delegation". Empty when effect is not EFFECT_DENY.
  string denied_leg = 9;

  // denied_at_depth is the chain depth a delegation-leg denial occurred at,
  // or -1 when the denial (if any) was not a delegation-leg denial.
  int32 denied_at_depth = 10;

  // reason is the overall, human-readable explanation for effect — the
  // denying leg's reason when effect is EFFECT_DENY, or the escalating leg's
  // reason when EFFECT_ESCALATE.
  string reason = 11;

  // decided_source and decided_policy_id name the policy verdict the
  // decision was attributed to: which engine or grant model produced it
  // ("cedar", "rego", "none", ...) and which policy or entitlement row.
  //
  // Both are optional, for the same reason declared_tier above is: a
  // decision can be default-deny with no verdict at all (an empty or nil
  // principal verdict list), and that case must stay distinguishable from a
  // verdict that did decide the outcome whose source/policy ID happen to be
  // empty strings. Unset means the former; present-but-empty means the
  // latter.
  optional string decided_source = 12;
  optional string decided_policy_id = 13;

  // approval_id is the id of the pending approval row created for this
  // decision. Populated only when effect is EFFECT_ESCALATE; empty for
  // every other effect — the same convention denied_leg above uses (empty
  // unless one specific effect applies), not decided_source/
  // decided_policy_id's optional treatment: unlike those two fields, a
  // created approval id is never itself legitimately the empty string, so
  // there is no "populated but blank" case here for presence-tracking to
  // distinguish from "not applicable."
  string approval_id = 14;

  // epoch is the tenant's revocation epoch (spec §4.8.1; tenant_epoch,
  // migrations/000001_baseline, bumped by migrations/000015_tenant_epoch_
  // trigger) as of the FIRST read this call made — read before the agent,
  // the delegation chain, or the tenant's policies, so a revocation that
  // bumps it mid-call can only ever make this response look OLDER than the
  // state it actually reflects, never newer (internal/pdpgrpc's
  // loadEpochOrDeny doc comment covers the hazard the reverse order would
  // create). A future PEP cache validates against this instead of paying a
  // second round trip to ask.
  //
  // Optional for the same presence-vs-zero-value reason decided_source/
  // decided_policy_id are: unset means the epoch was never read at all — the
  // call denied during authentication, before loadEpochOrDeny ever ran — and
  // that must stay distinguishable from a legitimately read value. Never
  // populated with 0 or any other fallback on a read failure: a read that
  // fails denies the call outright (internal/pdpgrpc.loadEpochOrDeny), it
  // does not reach a response for this field to be zeroed on.
  optional int64 epoch = 15;

  // sender_constrained reports whether the token this call presented was
  // bound to a key — a cnf.jkt claim, RFC 9449 §6.1 — AND a DPoP proof of
  // possession of that key was verified for this exact request (spec §4.7.2
  // K7).
  //
  // CONSULT IT ONLY WHEN effect IS EFFECT_ALLOW OR EFFECT_ESCALATE. On an
  // ALLOW, false means the caller presented an ordinary bearer token, and that
  // is the question K5's refusal turns on. On an ESCALATE it carries the same
  // real answer, for the reason the enumeration below gives, and K11 needs it
  // there: a network surface must degrade a BOUND escalation to a denial
  // rather than blocking on it, because the proof it would wait with is
  // single-use (K8) and short-lived (K9) while a human approval is neither —
  // and it must refuse an UNBOUND one outright rather than paging a human for
  // a decision K5 will refuse anyway.
  //
  // NEVER consult it on a DENY. That is the case the rest of this comment is
  // about, and the one where the value can mean nothing at all.
  //
  // On a denial it is populated inconsistently, by construction, and the rule
  // is worth stating precisely rather than approximately — the PDP fills this
  // in on the tail of Decide, so:
  //
  //   - A decision that REACHED the three-leg evaluation carries the real
  //     answer, whatever the verdict. A bound token with a valid proof that
  //     is then denied at the principal, agent, or delegation leg — or that
  //     escalates — reports true.
  //   - A decision denied BEFORE that evaluation reports false regardless of
  //     what was presented: a token that failed to verify, a proof that
  //     failed, a jti that could not be spent, and the tool-catalog,
  //     tier-override, and DeriveTier load failures all return early.
  //
  // So false on a denial means "not established", never "the caller presented
  // a bearer token". Reading it as the latter would be wrong for three of
  // those six paths, where the caller's token may well have been bound.
  //
  // It REPORTS; it does not refuse. A bearer token is legitimate on the local
  // surfaces (hook, mcp), where the caller already holds the session file the
  // token lives in and binding would buy nothing (K5) — refusing one in the
  // PDP would break that entire fleet. The two NETWORK surfaces (proxy,
  // extauthz) are where K5 requires the refusal, and this field is how they
  // make it: a PEP cannot read cnf.jkt for itself without parsing a token it
  // has no key to verify, and a PEP that decides anything about a credential
  // is a PEP making an authorization decision (D1).
  //
  // Never true without a verified proof, so this is not a second, weaker
  // signal sitting alongside effect: a bound token presented with a missing,
  // stale, wrong-key, wrong-request, or replayed proof is denied outright and
  // never reaches a response carrying true.
  bool sender_constrained = 16;
}

// RequestedScope is what a caller asks a new delegation to hold: an action-
// tier ceiling and a tool set. Both are resource-independent — the same two
// dimensions internal/authz.Clamp narrows (spec §3.8 G6, amended
// 2026-08-10) — because resource scope and classification are not
// probeable ahead of a concrete resource; see internal/policy.GrantProbe's
// doc comment for why.
message RequestedScope {
  int32 max_action_tier = 1;

  // tools must not be empty. Everywhere else in this system an empty tool
  // list means UNRESTRICTED (models.Agent.HasTool, models.Delegation.HasTool,
  // deliberately) — requesting one here would mean requesting unrestricted
  // access, exactly what this gate exists to prevent, and it is structurally
  // unprobeable: there is no policy question "may this principal hold every
  // tool that exists." CreateDelegation rejects an empty list with
  // INVALID_ARGUMENT before any policy is consulted.
  repeated string tools = 2;

  // escalate_at asks for an escalation threshold: at or above this tier a
  // call waits for a human instead of being allowed. It can only make the
  // delegation STRICTER. The effective threshold is the lower of this and the
  // one the delegation would otherwise carry (the agent's, for a root; the
  // parent's, for a child). It can never raise or remove that threshold,
  // because the caller is the party being policed: omitting it changes
  // nothing. Unset means "nothing requested", not "never escalate".
  optional int32 escalate_at = 3;
}

// ScopeRemoval names one thing CreateDelegation took away from a
// RequestedScope, and why. Fields mirror internal/authz.ClampRemoval one for
// one — Dimension/Value/Reason/Detail are plain strings there for the same
// reason they are here: this is written straight into the response, and a
// closed enum buys nothing a string doesn't already give a caller or an
// auditor.
message ScopeRemoval {
  string dimension = 1; // "tier" or "tool"
  string value = 2;     // the requested tier's name, or the tool name

  string reason = 3; // "denied" or "probe error"

  // detail carries the probe error's text when reason is "probe error".
  // Empty when reason is "denied" — there is no engine error to report,
  // only a verdict.
  string detail = 4;
}

// GrantedScope is what survived internal/authz.Clamp: the narrowed ceiling
// and tool set, plus what was removed and why.
message GrantedScope {
  int32 max_action_tier = 1;

  // tools is the intersection of what was requested and what the principal's
  // own policy grants. It is never empty on a response that reaches the
  // caller: a request whose tools were every one clamped away is rejected
  // with PERMISSION_DENIED instead of being returned here as an empty list.
  // An empty list here would be indistinguishable from "this delegation
  // holds every tool" under the same empty-means-unrestricted convention
  // RequestedScope.tools documents above — the exact inversion this gate
  // exists to prevent.
  repeated string tools = 2;

  repeated ScopeRemoval removed = 3;

  // escalate_at is the threshold the delegation was actually issued with.
  // Unset means it never escalates: none was set, or the granted ceiling sits
  // below it so it could never fire (removed then names it).
  optional int32 escalate_at = 4;
}

// CreateDelegationRequest asks the PDP to mint a new delegation — a root
// grant from a principal, or (with parent_delegation_id set) a child
// narrowing an existing one.
//
// No tenant field, for the same reason DecideRequest has none: the tenant is
// startup configuration (internal/config.Config.TenantID), never taken from
// a request field. See DecideRequest's doc comment above for the
// predecessor defect this avoids.
message CreateDelegationRequest {
  // subject identifies the principal the new delegation acts on behalf of.
  string subject = 1;

  // agent_id is the agent the new delegation is issued to. A UUID string.
  string agent_id = 2;

  RequestedScope requested_scope = 3;

  // parent_delegation_id, when set, makes this a child delegation: it must
  // narrow the parent (permset.ScopeNarrows, enforced inside
  // store.CreateDelegation) or the call fails with PERMISSION_DENIED. Empty
  // means a root delegation, granted directly from the principal — a UUID
  // string is never legitimately empty, so no separate presence field is
  // needed the way declared_tier above needs one.
  string parent_delegation_id = 4;

  string purpose = 5;

  // ttl_seconds is how long the new delegation is valid for, measured from
  // the instant the server creates it. Must be positive.
  int64 ttl_seconds = 6;

  // parent_token is a current token this PDP issued for parent_delegation_id.
  // Required whenever parent_delegation_id is set, and it is what authorizes
  // the request: narrowing a delegation is something only its holder may do.
  // A delegation id is not a secret (it appears in audit entries, admin
  // listings, and session files), so an id alone must never be enough to
  // obtain a credential derived from it, which a child's token is.
  //
  // Unlike IssueTokenRequest.token, this one must be UNEXPIRED: a holder
  // whose token has lapsed re-issues first. A token bound to a key ("cnf")
  // is refused here. This request carries no proof of possession, so
  // accepting one would let a stolen bound token be traded for an unbound
  // child token.
  string parent_token = 7;

  // principal_token is an OIDC token from the operator's identity provider,
  // proving who this ROOT delegation is for. The PDP verifies it (signature,
  // issuer, audience, expiry) and reads the principal from the claim it is
  // configured with. `subject` above then only has to agree: it may be empty,
  // but if set and different, the request is refused.
  //
  // This is what stops a PEP from starting a session for a principal of its
  // choosing. `subject` on its own is a claim by the party being policed.
  //
  // Required for a root unless the PDP runs with
  // STRATIUM_PRINCIPAL_AUTH_INSECURE=true (local development), in which case
  // it is ignored and `subject` is believed. Not accepted on a child: a child
  // is authorized by parent_token and always acts for its chain's root
  // principal.
  string principal_token = 8;
}

// CreateDelegationResponse is the new delegation's id and what it was
// actually granted — which may be narrower than what was requested. A
// caller that asked for three tools and received one must be able to see
// which one and why (granted_scope.removed), not just that the set shrank.
message CreateDelegationResponse {
  string delegation_id = 1;
  GrantedScope granted_scope = 2;

  // token is a fresh, signed credential naming this delegation (spec
  // §4.7.1 K3: it is an authenticated REFERENCE, never a capability — it
  // carries none of granted_scope's fields, deliberately, so a later
  // revocation or narrowing of the row this token names takes effect
  // immediately instead of being contradicted by a stale copy the token
  // carried itself). Its expiry is exactly this delegation's own
  // expires_at — decode the token's own "exp" claim to read it rather than
  // this message repeating a second copy that could drift from the first,
  // the way IssueTokenResponse.expires_at below legitimately can (that
  // response's requested ttl_seconds may be clamped; this one is never
  // independently requested at all, so there is nothing to clamp).
  // Signing failure fails the whole call (see the service's IssueToken
  // comment for why the same rule applies there) — a delegation_id ever
  // reaches a caller here only paired with a token that names it.
  string token = 3;

  // epoch is the tenant's revocation epoch (spec §4.8.1) as of the first
  // read this call made, the same field DecideResponse.epoch documents at
  // length — read before the agent, the parent chain, or the tenant's
  // policies this call probes to clamp the request. Not optional here,
  // unlike DecideResponse.epoch: every failure this RPC can hit, including
  // the epoch read itself, returns before any CreateDelegationResponse is
  // ever constructed (see CreateDelegation's own doc comment), so unlike
  // Decide there is no successful response on this message that was ever at
  // risk of not having one.
  //
  // Carried here, and on IssueTokenResponse below, so a PEP that has just
  // started a session or just refreshed its token holds an epoch baseline
  // immediately — without this, it would hold none at all until its first
  // Decide call, the one gap a cache keyed on this value would otherwise
  // have from the moment credentials are minted.
  int64 epoch = 4;
}

// IssueTokenRequest asks for a fresh token naming an existing delegation —
// re-issuance for a caller whose earlier token expired while the delegation
// it named did not. It never re-derives or re-clamps scope: that was
// already decided once, by CreateDelegation, and this message carries
// nothing that could change it — see IssueToken's own doc comment on the
// service below for what re-issuance re-checks instead.
message IssueTokenRequest {
  // delegation_id is the delegation the new token should name. A UUID
  // string, always required and never legitimately empty — the same
  // convention parent_delegation_id (CreateDelegationRequest) and
  // approval_id (GetApprovalRequest) use for a required id.
  string delegation_id = 1;

  // ttl_seconds is how long the caller would like the new token to remain
  // valid, measured from the instant the server issues it — the same
  // "positive, measured from now" contract CreateDelegationRequest.ttl_seconds
  // already uses. The token's ACTUAL expiry is never later than the named
  // delegation's own expires_at, whatever this value asks for: a token
  // outliving the delegation it names would be a credential authenticating
  // authority that no longer exists. IssueTokenResponse.expires_at reports
  // what was actually granted, and clamped_to_delegation_expiry says
  // whether that differed from what was requested here.
  int64 ttl_seconds = 2;

  // dpop_jwk is the caller's PUBLIC key as a JWK document (RFC 7517), and it
  // asks for a token bound to that key: the issued token then carries a
  // "cnf" claim whose "jkt" member is the key's RFC 7638 thumbprint (spec
  // §4.7.2 K6, RFC 9449 §6.1), so only whoever holds the matching private
  // half — which never leaves the caller and is never sent here — can
  // produce a DPoP proof for it. That is what turns a stolen token from a
  // usable credential into an inert string on the surfaces that check.
  //
  // Optional, and its absence is NOT an error: this RPC cannot know which
  // enforcement surface will present the token it mints, so it is not in a
  // position to decide whether binding is required. No JWK yields a bearer
  // token, exactly as before this field existed. K5 is what makes an unbound
  // token useless where it matters — proxy and extauthz refuse one — so an
  // agent that intends to use either surface must supply a JWK and learns
  // otherwise on its first call, not here. Deliberately NOT a "surface" or
  // "intended use" field: that would be a client declaring how its own
  // credential ought to be treated, which is the shape of spec defect D1.
  //
  // optional, following approval_id (DecideRequest) rather than
  // parent_delegation_id's plain-string convention, and for the same reason
  // that field states: an explicitly-sent empty string is a caller bug —
  // meant to bind, sent nothing — and earns its own InvalidArgument instead
  // of being silently reinterpreted as "no JWK, issue a bearer token," which
  // would hand back a credential its holder believes is bound and every
  // network surface will refuse. A malformed, symmetric, or private-key JWK
  // is InvalidArgument here for the same reason, rather than a token bound
  // to a thumbprint nobody can reproduce: that failure costs one call to
  // diagnose at issuance and every subsequent call to diagnose later.
  optional string dpop_jwk = 3;

  // token is a token this PDP previously issued for delegation_id: the one
  // being replaced. Required. It is what authenticates this call. A
  // delegation id is not a secret (it appears in audit entries, admin
  // listings, and session files), so an id alone must never be enough to
  // mint a credential for it.
  //
  // Its signature must verify and it must name delegation_id. Its EXPIRY is
  // deliberately not checked: replacing an expired token is what this RPC is
  // for. The delegation's own revocation and expiry are still checked fresh,
  // so an old token is only ever worth as much as the live delegation.
  //
  // If it is bound to a key (carries "cnf"), dpop_jwk must be present and
  // name the SAME key. Re-issuing can never loosen or move a binding;
  // otherwise whoever stole a bound token could trade it here for one bound
  // to a key of their own. An unbound token may be re-issued bound or
  // unbound: its holder already has a bearer credential.
  string token = 4;
}

// IssueTokenResponse is the re-issued token and its actual, possibly
// clamped, expiry.
message IssueTokenResponse {
  string token = 1;

  // expires_at is the new token's actual expiry: IssueTokenRequest's
  // requested ttl_seconds added to the issuing instant, then clamped to the
  // named delegation's own expires_at. Restated here rather than left for
  // the caller to decode from the token's own "exp" claim — unlike
  // CreateDelegationResponse.token, whose expiry can never differ from its
  // delegation's, this one legitimately can, and a caller scheduling its
  // next re-issuance needs the real value without needing to be a JWT
  // parser just to learn whether it got what it asked for.
  google.protobuf.Timestamp expires_at = 2;

  // clamped_to_delegation_expiry is true when the requested ttl_seconds
  // would have produced an expiry later than the named delegation's own
  // expires_at, and the server shortened it instead of granting what was
  // asked. A caller that assumed it received a full ttl_seconds and
  // scheduled its next refresh accordingly would otherwise learn its token
  // was already dead only by having a call unexpectedly denied — this makes
  // the gap between "asked for" and "got" explicit instead of something a
  // caller must infer by comparing two timestamps itself.
  bool clamped_to_delegation_expiry = 3;

  // epoch is the tenant's revocation epoch (spec §4.8.1), read before the
  // delegation this call re-issues a token for — see
  // CreateDelegationResponse.epoch's doc comment for why this RPC carries it
  // too (a re-issued token is exactly the other moment a PEP would otherwise
  // hold no epoch baseline) and DecideResponse.epoch's for the field's full
  // rationale. Not optional, for the same reason CreateDelegationResponse.epoch
  // is not: every failure IssueToken can hit returns before a response is
  // ever constructed.
  int64 epoch = 4;
}

// GetApprovalRequest asks for one approval's current disposition by id.
message GetApprovalRequest {
  // approval_id is the id DecideResponse.approval_id returned on the
  // original escalation. A UUID string, always required and never
  // legitimately empty -- the same convention parent_delegation_id
  // (CreateDelegationRequest, above) uses for a required id, rather than
  // declared_tier/approval_id-on-DecideRequest's optional treatment: there
  // is no "ask fresh" case here for presence-tracking to distinguish from.
  string approval_id = 1;
}

// GetApprovalResponse is read-only by construction: calling GetApproval never
// changes the row it names. Under E7 the PDP's serving role holds no UPDATE
// grant on approvals at all (migrations/000012_approvals' own GRANT
// comment), so this is enforced twice over -- once by this RPC simply never
// issuing a write, and once by the database refusing one if it ever did.
//
// It carries only what a poller needs to decide whether to keep waiting:
// status, and expires_at so a poller can recognize a row that can no longer
// resolve. Everything else on the row (which agent, which tool, the
// input_digest) is already known to whichever caller is polling -- it is the
// same caller the original escalating Decide call answered -- and repeating
// it back here would answer a question nobody asked.
message GetApprovalResponse {
  // status is the row's raw status column: "pending", "approved", or
  // "denied" -- the same closed, plain-string vocabulary
  // models.Approval.Status documents and deliberately does not promote to a
  // typed enum (that type's own doc comment explains why: it matches this
  // codebase's existing convention for other CHECK-constrained columns,
  // audit_chain.decision and audit_chain.denied_leg among them).
  string status = 1;

  google.protobuf.Timestamp expires_at = 2;
}

// ReportToolUseRequest tells the PDP that a tool call has run. A PEP sends it
// from a point AFTER the tool call (Claude Code's PostToolUse hook), on a
// separate path from the Decide that should have preceded it, so the PDP can
// notice a tool call it was never asked about.
message ReportToolUseRequest {
  // token is the delegation's token, the same credential Decide takes. It
  // identifies which delegation the tool call ran under. No proof of
  // possession accompanies it: this RPC authorizes nothing.
  string token = 1;

  // tool and raw_input are the tool call that ran, in the exact form
  // DecideRequest.tool and DecideRequest.raw_input carried for it. The match
  // is on the tool name and a digest of raw_input's bytes, so a PEP must
  // forward raw_input untouched, as it does for Decide.
  string tool = 2;
  string raw_input = 3;
}

message ReportToolUseResponse {
  // matched is true when the PDP holds an ALLOW decision for this
  // delegation, tool and raw_input. When false the PDP has recorded an
  // "unmatched_tool_use" audit entry.
  bool matched = 1;
}

service PDPService {
  rpc Decide(DecideRequest) returns (DecideResponse);
  rpc CreateDelegation(CreateDelegationRequest) returns (CreateDelegationResponse);

  // IssueToken re-issues a token for an existing delegation — the path a
  // caller whose earlier token expired uses to get a fresh one, without
  // going through CreateDelegation again (which would mint a NEW
  // delegation, not refresh access to this one).
  //
  // Re-issuance re-checks everything: the delegation named by
  // delegation_id is loaded fresh from this tenant (RLS makes another
  // tenant's delegation indistinguishable from a missing one, NOT_FOUND
  // either way — the same rule every other lookup in this service follows)
  // and the call is refused, PERMISSION_DENIED, if that row is revoked or
  // has itself expired. Trusting the id it was handed instead of loading it
  // would make this RPC a way to resurrect a dead delegation's authority —
  // the entire point of re-issuance is that the delegation is still alive,
  // which can only be established by loading it fresh, not assumed from a
  // caller's assertion. Signing failure fails the call the same way it does
  // for CreateDelegation: no response without a token, ever.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);

  // GetApproval reports one approval's current status and expiry, for a PEP
  // polling after an ESCALATE response. See GetApprovalResponse's own doc
  // comment for why this RPC has no path to write anything.
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);

  // ReportToolUse checks a tool call that has already run against the
  // decisions recorded for its delegation. It never changes a decision and
  // is not part of authorization: it exists so that a tool call which ran
  // without an ALLOW leaves an audit entry. See ReportToolUseRequest.
  rpc ReportToolUse(ReportToolUseRequest) returns (ReportToolUseResponse);
}
