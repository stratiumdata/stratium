// Package stratium.pdp.v1 is the PDP's external contract: one RPC, Decide,
// that turns a request into a compound authorization decision.
//
// See services/internal/authz for the pure decision function this wraps, and
// services/internal/pdpgrpc for the server that implements this service.
syntax = "proto3";

package stratium.pdp.v1;

import "google/protobuf/timestamp.proto";

option go_package = "stratium/internal/pdpgrpc;pdpgrpc";

// Effect mirrors internal/authz.Effect. EFFECT_DENY is deliberately the zero
// value, not EFFECT_UNSPECIFIED as typical proto3 style would put there: an
// Effect field that is never set, or that decodes from a truncated/corrupt
// message, must come back DENY, not silently ALLOW. This is the same
// invariant internal/authz.Effect documents for the Go type ("a leg that is
// never evaluated must deny rather than silently permit") — the wire format
// carries it through rather than reopening the gap at the boundary.
enum Effect {
  EFFECT_DENY = 0;
  EFFECT_ALLOW = 1;
  EFFECT_ESCALATE = 2;
}

// DecideRequest is everything the PDP needs from a caller to compute a
// decision for one action.
//
// Two things are deliberately absent from this message, and must stay
// absent:
//
//   - A tenant identifier. The tenant is startup configuration
//     (internal/config.Config.TenantID), fixed for the PDP's lifetime and
//     never taken from a request field. The predecessor system trusted a
//     client-supplied identity header (x-user-id) to select the tenant, and
//     that was a critical authentication bypass — any caller could name any
//     tenant simply by setting the header. A tenant field here would
//     reintroduce that exact defect over gRPC instead of HTTP.
//   - A principal decision. Evaluating the principal leg is the server's
//     job: it calls internal/policy.PrincipalPolicy itself, inside Decide,
//     using the identity gRPC's transport authenticated (Phase 2 adds
//     mTLS/OIDC for that; Phase 1c has no caller-verified identity at all,
//     which is exactly why nothing here lets a caller assert one). A field
//     carrying a caller-supplied verdict would let any caller hand the PDP
//     its own answer and have the PDP rubber-stamp it — the same class of
//     defect as the tenant header, aimed at authorization instead of
//     authentication.
message DecideRequest {
  // delegation_id is the acting delegation: the last hop in the chain, the
  // one actually presented for this action. A UUID string.
  string delegation_id = 1;

  // agent_id is the acting agent's registry ID. A UUID string.
  string agent_id = 2;

  // subject identifies the principal on whose behalf the agent acts.
  string subject = 3;

  string tool = 4;
  string verb = 5;
  string raw_input = 6;

  // declared_tier is the caller's claimed action tier. It is optional so
  // "the caller did not declare a tier" is distinguishable from "the caller
  // declared REASONING": REASONING is tier zero, a real, meaningful tier
  // (internal/authz never derives from this value — it is only cross-checked
  // against the tier the server derives itself), and collapsing "absent"
  // into that zero would silently turn a client that never set this field
  // into one asserting the lowest-sensitivity tier there is.
  optional int32 declared_tier = 7;

  // resource carries attributes the classification and delegation-scope
  // checks read (e.g. classification hierarchy levels). Caller-supplied and
  // untrusted like every other field here — it narrows what a delegation
  // permits, it does not widen it.
  map<string, string> resource = 8;

  // normalized_input is a best-effort extraction the caller performs from
  // raw_input — e.g. pulling "ls -la" out of {"command":"ls -la"} before
  // classification ever runs, so an agent framework that wraps tool input in
  // JSON does not defeat the read-only pattern's anchoring. It never
  // replaces raw_input: both travel on the wire, and
  // internal/authz.BuiltinTier combines them so that a positive destructive
  // or external match on raw_input wins outright and is never lowered;
  // otherwise a normalized_input that classifies is used; otherwise
  // raw_input's result, including its default. A positive pattern match is
  // evidence, a default is not — taking simply the more severe would let
  // raw's "unrecognised, assume it modifies" default override a correct
  // read-only extraction, which is the defect this field exists to fix. An
  // extraction that under-reports (or a caller that omits this field) can
  // never lower the tier below what a positive raw_input match produces. Plain (non-optional) proto3 string:
  // unlike declared_tier above, there is no absent-vs-empty distinction to
  // preserve here, because an empty extraction changes nothing.
  string normalized_input = 9;

  // approval_id, when set, names a pending approval this call should
  // consume rather than create: the retry sent after a prior call returned
  // EFFECT_ESCALATE with one. Optional for the same reason declared_tier
  // above is — "the caller is retrying with an approval to offer" must stay
  // distinguishable from "the caller is asking fresh," and a UUID-shaped
  // field cannot borrow parent_delegation_id's plain-string convention
  // (CreateDelegationRequest, below) to make that distinction, because an
  // explicitly-sent empty string here is a caller bug (meant to retry,
  // forgot to attach the id) worth its own InvalidArgument rather than
  // silent reinterpretation as "no approval, evaluate fresh" — which would
  // hide that bug behind a second, unwanted pending approval instead.
  optional string approval_id = 10;
}

// DecideResponse is the compound decision and each leg's individual
// contribution to it, so a caller (and the audit trail) can see not just the
// outcome but why.
message DecideResponse {
  Effect effect = 1;
  int32 derived_tier = 2;

  Effect principal_effect = 3;
  string principal_reason = 4;

  Effect agent_effect = 5;
  string agent_reason = 6;

  Effect delegation_effect = 7;
  string delegation_reason = 8;

  // denied_leg names which leg produced the denial: "principal", "agent", or
  // "delegation". Empty when effect is not EFFECT_DENY.
  string denied_leg = 9;

  // denied_at_depth is the chain depth a delegation-leg denial occurred at,
  // or -1 when the denial (if any) was not a delegation-leg denial.
  int32 denied_at_depth = 10;

  // reason is the overall, human-readable explanation for effect — the
  // denying leg's reason when effect is EFFECT_DENY, or the escalating leg's
  // reason when EFFECT_ESCALATE.
  string reason = 11;

  // decided_source and decided_policy_id name the policy verdict the
  // decision was attributed to: which engine or grant model produced it
  // ("cedar", "rego", "none", ...) and which policy or entitlement row.
  //
  // Both are optional, for the same reason declared_tier above is: a
  // decision can be default-deny with no verdict at all (an empty or nil
  // principal verdict list), and that case must stay distinguishable from a
  // verdict that did decide the outcome whose source/policy ID happen to be
  // empty strings. Unset means the former; present-but-empty means the
  // latter.
  optional string decided_source = 12;
  optional string decided_policy_id = 13;

  // approval_id is the id of the pending approval row created for this
  // decision. Populated only when effect is EFFECT_ESCALATE; empty for
  // every other effect — the same convention denied_leg above uses (empty
  // unless one specific effect applies), not decided_source/
  // decided_policy_id's optional treatment: unlike those two fields, a
  // created approval id is never itself legitimately the empty string, so
  // there is no "populated but blank" case here for presence-tracking to
  // distinguish from "not applicable."
  string approval_id = 14;
}

// RequestedScope is what a caller asks a new delegation to hold: an action-
// tier ceiling and a tool set. Both are resource-independent — the same two
// dimensions internal/authz.Clamp narrows (spec §3.8 G6, amended
// 2026-08-10) — because resource scope and classification are not
// probeable ahead of a concrete resource; see internal/policy.GrantProbe's
// doc comment for why.
message RequestedScope {
  int32 max_action_tier = 1;

  // tools must not be empty. Everywhere else in this system an empty tool
  // list means UNRESTRICTED (models.Agent.HasTool, models.Delegation.HasTool,
  // deliberately) — requesting one here would mean requesting unrestricted
  // access, exactly what this gate exists to prevent, and it is structurally
  // unprobeable: there is no policy question "may this principal hold every
  // tool that exists." CreateDelegation rejects an empty list with
  // INVALID_ARGUMENT before any policy is consulted.
  repeated string tools = 2;
}

// ScopeRemoval names one thing CreateDelegation took away from a
// RequestedScope, and why. Fields mirror internal/authz.ClampRemoval one for
// one — Dimension/Value/Reason/Detail are plain strings there for the same
// reason they are here: this is written straight into the response, and a
// closed enum buys nothing a string doesn't already give a caller or an
// auditor.
message ScopeRemoval {
  string dimension = 1; // "tier" or "tool"
  string value = 2;     // the requested tier's name, or the tool name

  string reason = 3; // "denied" or "probe error"

  // detail carries the probe error's text when reason is "probe error".
  // Empty when reason is "denied" — there is no engine error to report,
  // only a verdict.
  string detail = 4;
}

// GrantedScope is what survived internal/authz.Clamp: the narrowed ceiling
// and tool set, plus what was removed and why.
message GrantedScope {
  int32 max_action_tier = 1;

  // tools is the intersection of what was requested and what the principal's
  // own policy grants. It is never empty on a response that reaches the
  // caller: a request whose tools were every one clamped away is rejected
  // with PERMISSION_DENIED instead of being returned here as an empty list.
  // An empty list here would be indistinguishable from "this delegation
  // holds every tool" under the same empty-means-unrestricted convention
  // RequestedScope.tools documents above — the exact inversion this gate
  // exists to prevent.
  repeated string tools = 2;

  repeated ScopeRemoval removed = 3;
}

// CreateDelegationRequest asks the PDP to mint a new delegation — a root
// grant from a principal, or (with parent_delegation_id set) a child
// narrowing an existing one.
//
// No tenant field, for the same reason DecideRequest has none: the tenant is
// startup configuration (internal/config.Config.TenantID), never taken from
// a request field. See DecideRequest's doc comment above for the
// predecessor defect this avoids.
message CreateDelegationRequest {
  // subject identifies the principal the new delegation acts on behalf of.
  string subject = 1;

  // agent_id is the agent the new delegation is issued to. A UUID string.
  string agent_id = 2;

  RequestedScope requested_scope = 3;

  // parent_delegation_id, when set, makes this a child delegation: it must
  // narrow the parent (models.ScopeNarrows, enforced inside
  // store.CreateDelegation) or the call fails with PERMISSION_DENIED. Empty
  // means a root delegation, granted directly from the principal — a UUID
  // string is never legitimately empty, so no separate presence field is
  // needed the way declared_tier above needs one.
  string parent_delegation_id = 4;

  string purpose = 5;

  // ttl_seconds is how long the new delegation is valid for, measured from
  // the instant the server creates it. Must be positive.
  int64 ttl_seconds = 6;
}

// CreateDelegationResponse is the new delegation's id and what it was
// actually granted — which may be narrower than what was requested. A
// caller that asked for three tools and received one must be able to see
// which one and why (granted_scope.removed), not just that the set shrank.
message CreateDelegationResponse {
  string delegation_id = 1;
  GrantedScope granted_scope = 2;
}

// GetApprovalRequest asks for one approval's current disposition by id.
message GetApprovalRequest {
  // approval_id is the id DecideResponse.approval_id returned on the
  // original escalation. A UUID string, always required and never
  // legitimately empty -- the same convention parent_delegation_id
  // (CreateDelegationRequest, above) uses for a required id, rather than
  // declared_tier/approval_id-on-DecideRequest's optional treatment: there
  // is no "ask fresh" case here for presence-tracking to distinguish from.
  string approval_id = 1;
}

// GetApprovalResponse is read-only by construction: calling GetApproval never
// changes the row it names. Under E7 the PDP's serving role holds no UPDATE
// grant on approvals at all (migrations/000012_approvals' own GRANT
// comment), so this is enforced twice over -- once by this RPC simply never
// issuing a write, and once by the database refusing one if it ever did.
//
// It carries only what a poller needs to decide whether to keep waiting:
// status, and expires_at so a poller can recognize a row that can no longer
// resolve. Everything else on the row (which agent, which tool, the
// input_digest) is already known to whichever caller is polling -- it is the
// same caller the original escalating Decide call answered -- and repeating
// it back here would answer a question nobody asked.
message GetApprovalResponse {
  // status is the row's raw status column: "pending", "approved", or
  // "denied" -- the same closed, plain-string vocabulary
  // models.Approval.Status documents and deliberately does not promote to a
  // typed enum (that type's own doc comment explains why: it matches this
  // codebase's existing convention for other CHECK-constrained columns,
  // audit_chain.decision and audit_chain.denied_leg among them).
  string status = 1;

  google.protobuf.Timestamp expires_at = 2;
}

service PDPService {
  rpc Decide(DecideRequest) returns (DecideResponse);
  rpc CreateDelegation(CreateDelegationRequest) returns (CreateDelegationResponse);

  // GetApproval reports one approval's current status and expiry, for a PEP
  // polling after an ESCALATE response. See GetApprovalResponse's own doc
  // comment for why this RPC has no path to write anything.
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
}
