syntax = "proto3";

package platform;

option go_package = "stratium/services/platform";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// PlatformService provides decision and entitlement management
service PlatformService {
    // GetDecision retrieves a decision based on the provided criteria
    rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse);

    // GetEntitlements retrieves entitlements for a given subject
    rpc GetEntitlements(GetEntitlementsRequest) returns (GetEntitlementsResponse);
}

// Request message for GetDecision
message GetDecisionRequest {
    // Subject making the request (e.g., user ID, service ID)
    map<string, google.protobuf.Value> subject_attributes = 1;

    // Resource being accessed
    map<string, string> resource_attributes = 2;

    // Action being performed
    string action = 3;

    // Additional context for the decision
    map<string, string> context = 4;

    // Optional policy ID to evaluate against
    string policy_id = 5;

    // --- Agent authorization fields (ignored when agent-auth feature is disabled) ---

    // Single-agent attributes (for simple user→agent delegation)
    AgentAttributes agent_attributes = 6;

    // Single delegation context
    DelegationContext delegation_context = 7;

    // Delegation chain fields (for N-level subagent authorization)
    // Ordered from root (user's direct agent) to leaf (executing agent)
    repeated AgentAttributes agent_chain = 8;
    repeated DelegationContext delegation_chain = 9;
}

// Response message for GetDecision
message GetDecisionResponse {
    // Decision result
    Decision decision = 1;

    // Reason for the decision
    string reason = 2;

    // Additional details about the decision
    map<string, string> details = 3;

    // Timestamp when the decision was made
    google.protobuf.Timestamp timestamp = 4;

    // Policy that was evaluated
    string evaluated_policy = 5;

    // Compound decision breakdown (populated when agent_attributes are present)
    CompoundDecision compound_decision = 6;
}

// Decision enum
enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOW = 1;
    DECISION_DENY = 2;
    DECISION_CONDITIONAL = 3;
}

// Request message for GetEntitlements
message GetEntitlementsRequest {
    // Subject to get entitlements for
    map<string, google.protobuf.Value> subject = 1;

    // Optional resource filter
    string resource_filter = 2;

    // Optional action filter
    string action_filter = 3;

    // Optional context for entitlement evaluation
    map<string, string> context = 4;

    // Pagination token
    string page_token = 5;

    // Page size (default: 50, max: 1000)
    int32 page_size = 6;
}

// Response message for GetEntitlements
message GetEntitlementsResponse {
    // List of entitlements
    repeated Entitlement entitlements = 1;

    // Next page token (empty if no more pages)
    string next_page_token = 2;

    // Total count of entitlements (optional)
    int64 total_count = 3;

    // Timestamp when entitlements were retrieved
    google.protobuf.Timestamp timestamp = 4;
}

// Entitlement represents a permission or access right
message Entitlement {
    // Unique identifier for the entitlement
    string id = 1;

    // Subject the entitlement applies to
    string subject = 2;

    // Resource the entitlement grants access to
    string resource = 3;

    // Actions allowed on the resource
    repeated string actions = 4;

    // Conditions that must be met for the entitlement to be valid
    repeated Condition conditions = 5;

    // Entitlement metadata
    map<string, string> metadata = 6;

    // When the entitlement was created
    google.protobuf.Timestamp created_at = 7;

    // When the entitlement expires (optional)
    google.protobuf.Timestamp expires_at = 8;

    // Whether the entitlement is active
    bool active = 9;
}

// Condition represents a condition that must be met
message Condition {
    // Type of condition (e.g., "time", "location", "attribute")
    string type = 1;

    // Operator for the condition (e.g., "equals", "contains", "greater_than")
    string operator = 2;

    // Value to compare against
    string value = 3;

    // Additional parameters for the condition
    map<string, string> parameters = 4;
}

// --- Agent Authorization Messages ---

// AgentTrustTier defines the trust level of an agent
enum AgentTrustTier {
    AGENT_TRUST_TIER_UNVERIFIED = 0;
    AGENT_TRUST_TIER_REGISTERED = 1;
    AGENT_TRUST_TIER_CERTIFIED = 2;
    AGENT_TRUST_TIER_PLATFORM_TRUSTED = 3;
}

// ActionTier defines the sensitivity level of an action
enum ActionTier {
    ACTION_TIER_REASONING = 0;
    ACTION_TIER_READ_ONLY = 1;
    ACTION_TIER_INTERNAL_MODIFY = 2;
    ACTION_TIER_EXTERNAL_COMMS = 3;
    ACTION_TIER_DESTRUCTIVE = 4;
}

// ExecutionMode defines how the agent is acting
enum ExecutionMode {
    EXECUTION_MODE_DELEGATED = 0;
    EXECUTION_MODE_SYSTEM = 1;
}

// AgentAttributes contains the attributes of an agent in the authorization chain
message AgentAttributes {
    string agent_id = 1;
    string agent_name = 2;
    AgentTrustTier trust_tier = 3;
    string provider = 4;
    string model_identifier = 5;
    repeated string allowed_tools = 6;
    repeated ActionTier allowed_actions = 7;
    string tenant_id = 8;
}

// DelegationContext contains the delegation scope for policy evaluation
message DelegationContext {
    string delegation_id = 1;
    string user_id = 2;
    string agent_id = 3;
    string conversation_id = 4;
    ExecutionMode execution_mode = 5;
    ActionTier action_tier = 6;
    string tool_name = 7;
    string purpose = 8;
    map<string, string> classification_caps = 9;
    map<string, string> resource_constraints = 10;

    // Chain fields
    string parent_delegation_id = 11;
    string root_delegation_id = 12;
    int32 depth = 13;
    repeated string chain_agent_ids = 14;
}

// CompoundDecision breaks down the authorization decision by component
message CompoundDecision {
    // User authorization
    Decision user_decision = 1;
    string user_reason = 2;

    // Single-agent decision (backward compatible)
    Decision agent_decision = 3;
    string agent_reason = 4;
    Decision delegation_decision = 5;
    string delegation_reason = 6;

    // Chain decision breakdown (ordered root to leaf)
    repeated ChainHopDecision chain_decisions = 7;

    // Depth where first DENY occurred (-1 if all ALLOW)
    int32 denied_at_depth = 8;

    // Principal that denied ("user", "agent:<id>", or "delegation:<id>")
    string denied_principal = 9;
}

// ChainHopDecision contains the decision for a single hop in the delegation chain
message ChainHopDecision {
    int32 depth = 1;
    string agent_id = 2;
    string delegation_id = 3;
    Decision agent_decision = 4;
    string agent_reason = 5;
    Decision delegation_decision = 6;
    string delegation_reason = 7;
}