# Platform Server Configuration - Docker Deployment

service:
  name: platform-server
  version: 1.0.0
  environment: development

server:
  host: 0.0.0.0
  port: 50051
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 300s
  graceful_stop: 60s
  tls:
    enabled: true
    cert_file: /etc/stratium/certs/server.crt
    key_file: /etc/stratium/certs/server.key
    ca_file: /etc/stratium/certs/ca.crt
    client_ca_file: /etc/stratium/certs/ca.crt
    require_client_cert: false

database:
  driver: postgres
  host: postgres
  port: 5432
  database: stratium_pap
  user: stratium
  password: stratium  # Override via STRATIUM_DATABASE_PASSWORD
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

cache:
  type: redis
  ttl: 10m
  redis:
    address: redis:6379
    db: 0
    prefix: "stratium:policy:"

security:
  rate_limiting:
    enabled: false
    requests_per_min: 1000
    burst: 500
  cors:
    enabled: true
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
    expose_headers:
      - Content-Length
      - Content-Type
    allow_credentials: true
    max_age: 3600s
  fips:
    enabled: false
    go_module: v1.0.0-c2097c7c

license:
  enabled: false
  file: /etc/stratium/license.jwt
  public_key_file: /etc/stratium/license-public.pem
  deployment_id: ""
  refresh_interval: 5m

encryption:
  algorithm: RSA2048
  key_rotation: false

logging:
  level: info
  format: json
  output: stdout

observability:
  metrics:
    enabled: true
    address: ":9090"
    path: /metrics
  tracing:
    enabled: true
    provider: otlp
    endpoint: otel-collector:4317
    service_name: platform-server

platform:
  seed_sample_data: true
  seed_data_path: /etc/stratium/platform-seed.yaml

agent_gateway:
  enabled: true
