# Local/CI stack for the Task 7 end-to-end proof: postgres:16 plus the PDP
# built from ./Dockerfile. `make integration` (repo root) drives this file:
# fresh volumes up, integration tests against the running stack, volumes
# torn down again — see that target for the exact sequence.
#
# Ports are published without a fixed host port ("5432", not "5432:5432")
# so this doesn't collide with a developer's own Postgres or a previous run;
# `docker compose port <service> <port>` resolves the actual mapping.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev_only
      POSTGRES_DB: postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pdp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Two different roles, not one: see init-db.sql for why, and main.go's
      # package doc for how it uses them. Neither is "postgres" — the PDP
      # must never authenticate as the bootstrap superuser (that would make
      # every row-level-security policy in migrations/000002 and 000003 a
      # no-op for it).
      #
      # stratium_migrate: migrations only. main.go closes this connection
      # before it starts serving.
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      # stratium: the serving connection. Not a member of
      # stratium_audit_owner — main.go's startup check refuses to serve if
      # it ever is.
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-one
      STRATIUM_LISTEN_ADDR: :50051
      # Load-bearing as of Phase 9 Task 2: main.go now calls
      # internal/token.Load at startup, so this must name a real, readable
      # EC PEM or the container fails to start. The Dockerfile's builder
      # stage generates one fresh on every image build (openssl, a
      # transient build-time dependency only — see that file's own
      # comment) and COPYs it into the runtime image at this exact path;
      # nothing here is a key committed to the repo. Good enough for
      # `make integration`'s own purposes — proving the signing path works
      # end to end — but is not, and is not meant to be, how a real
      # deployment's key reaches the PDP (an operator-mounted file, per
      # K1).
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # Required with no default (spec §4.7.2 K9): an operator states how
      # much clock skew between an agent and the PDP is tolerable, and no
      # value is right for every deployment -- a guess is either useless or
      # too permissive. Every PDP service in this file therefore sets it, and
      # a service that forgot would fail to START rather than serve with a
      # silently-defaulted window.
      #
      # 30s is generous for containers sharing one host clock; a real fleet
      # tunes it to its own NTP discipline. STRATIUM_SPENT_PROOF_REAP_INTERVAL
      # is deliberately left UNSET here, so `make integration` exercises the
      # 5m default rather than a value only this file uses.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # Second PDP instance, wired for one purpose: internal/store/
  # store_integration_test.go's TestIntegration_Live_OrphanLanguageDeniesNamingIt
  # (Phase 4a Task 5) needs to seed a policy in a language absent from a
  # running PDP's own registry and observe the resulting denial over real
  # gRPC. `pdp` above cannot serve that test — its STRATIUM_TENANT_ID is
  # fixed for the life of the process (main.go builds one tenant-scoped
  # store.Store at startup; nothing about a request can change it), and its
  # own STRATIUM_POLICY_LANGUAGES is every language this build ships,
  # because every OTHER proof in that test file needs all four registered.
  # Narrowing `pdp`'s own languages to reach this one test would silently
  # break every one of those. A second, independently configured service —
  # its own tenant, its own registry one language short — is what makes the
  # orphan-language case reachable at all without touching `pdp`.
  #
  # Shares the same postgres instance as `pdp` (RLS keyed on
  # STRATIUM_TENANT_ID keeps the two tenants apart) rather than a second
  # database: nothing about this proof needs isolated storage, only an
  # isolated policy-engine registry.
  pdp-narrow:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-narrow-registry-integration
      STRATIUM_LISTEN_ADDR: :50051
      # The ONLY service that overrides the 5m default, and it is not an
      # arbitrary choice of service: TestIntegration_SpentProofReaper_
      # RunsOnASchedule (internal/store) plants an already-expired row for
      # this tenant and waits for this container's own reaper to delete it.
      # That is the only test in the suite that can fail if the shipped
      # binary stops SCHEDULING the reaper at all -- reaper.go's unit tests
      # prove the loop behaves, and nothing else proves anything calls it.
      #
      # pdp-narrow rather than `pdp`, because this service exists only to
      # register one policy language short and is otherwise idle, so a sweep
      # every 2s costs nothing and races nothing. Every other PDP here leaves
      # the default in place, so `make integration` still exercises it.
      STRATIUM_SPENT_PROOF_REAP_INTERVAL: 2s
      # See the "pdp" service's own comment on this variable above — same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
      # Deliberately omits "rego" — one of the four languages this build
      # ships, not an invented fifth one, so the gap this proves is exactly
      # "an operator's own STRATIUM_POLICY_LANGUAGES left something out,"
      # not "an unimplemented language was named." store_integration_test.go's
      # narrowRegistryMissingLanguage constant must name the same language;
      # nothing here re-derives that from the other, but a drift between the
      # two does not fail silently — the live test seeds a policy in
      # whatever language that constant names and asserts a DENY naming it,
      # so if this list ever registered that language after all, the test
      # would see an ALLOW (or a different Source) and fail loudly on the
      # mismatch, not pass by accident.
      STRATIUM_POLICY_LANGUAGES: cedar,json,xacml
    ports:
      - "50051"

  # Third PDP instance, wired for one purpose: internal/store/
  # store_integration_test.go's resource-identity live proofs (Phase 7 Task
  # 4) need a real Decide() call, over real gRPC, against a delegation
  # carrying ResourceConstraints/ClassificationCaps and a principal policy
  # that legitimately allows -- but neither `pdp` nor `pdp-narrow` above can
  # serve that safely. `pdp`'s tenant (tenant-one) already carries
  # TestEndToEnd's own cedar policies (its proof2 depends on exactly zero
  # existing at one specific point in that sequence -- see
  # TestIntegration_LoadAllPolicies_RoundTripsPriority's own comment on the
  # earlier task that broke four proofs this way) and TestEndToEnd's own
  # last subtest permanently revokes the serving role's INSERT on
  # audit_chain for the rest of that postgres instance's life, which would
  # turn every later Decide() call -- on ANY tenant, `pdp-narrow` included,
  # since the revoke is role-level, not tenant-scoped -- into an audit-write
  # failure instead of a real decision. `pdp-narrow`'s own tenant is no
  # safer a second time over: its one existing live test seeds an
  # unconditional cedar forbid there, which would blanket-deny every
  # principal forever after. A third, independently configured service --
  # its own tenant, touched by nothing else in that file -- is what makes
  # these proofs reachable without an ordering dependency on any other test.
  #
  # Shares the same postgres instance as `pdp`/`pdp-narrow` (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart). Full default policy-language
  # registry (STRATIUM_POLICY_LANGUAGES left unset), matching `pdp` --
  # these proofs only ever need cedar, but there is no reason to narrow the
  # registry the way pdp-narrow deliberately does for its own, different
  # purpose.
  pdp-resource:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-resource-identity-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above — same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # Fourth PDP instance, wired for one purpose: Task 4's real-Envoy proof
  # (services/internal/store/extauthz_integration_test.go) needs a PDP that
  # is safe to seed cedar policies, delegations, tool_catalog rows, and
  # approvals into from a live HTTP request routed through a live Envoy --
  # exactly the same reason pdp-narrow and pdp-resource above each exist
  # instead of reusing pdp's own tenant-one, restated a third time: tenant-one
  # already carries TestEndToEnd's own cedar policies and its own
  # order-dependent proofs, and neither pdp-narrow's nor pdp-resource's
  # tenant is touched by anything outside their own one test file either. A
  # fourth tenant, touched by nothing but the extauthz proof, is what makes
  # that proof reachable without an ordering dependency on any other test.
  #
  # Shares the same postgres instance as the three PDPs above (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart). Full default policy-language
  # registry (STRATIUM_POLICY_LANGUAGES left unset), matching pdp and
  # pdp-resource: the extauthz proof only ever needs cedar.
  #
  # Reached two different ways by the integration test: directly, over gRPC
  # from the host (mint tokens, and — since stratium-pep extauthz has no way
  # to attach approval_id to a retry, see pep-extauthz's own comment below —
  # send the approved retry straight to this PDP rather than through Envoy);
  # and indirectly, through pep-extauthz -> envoy, exactly as a real
  # deployment's traffic would arrive.
  pdp-extauthz:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-extauthz-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above — same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # stratium-pep, running in extauthz mode: the ext_authz service the envoy
  # service below calls on every request it fronts. Built from a separate
  # Dockerfile (Dockerfile.pep, this directory) — see that file's own
  # comment for why stratium-pdp's own Dockerfile is not simply reused with a
  # different build target.
  #
  # AgentID and Subject are fixed here, not read off any request — the same
  # fact extauthz.go's own package doc states for why this surface has no
  # session file (the token, not the identity, is what arrives per request).
  # That makes them compose-time constants a live HTTP request cannot carry,
  # so extauthz_integration_test.go hardcodes the identical two values as Go
  # constants (extauthzAgentID, extauthzSubject) rather than reading them
  # from an env var this file would otherwise need to also publish — the
  # same reasoning STRATIUM_TENANT_ID above already establishes for this
  # compose file (a fixed value the test file's own constant must match, not
  # a dynamic one the test discovers). The agent ID has no special meaning;
  # it was generated once with no committed key or secret behind it.
  #
  # Never published to the host: only the envoy service below, and other
  # containers on this compose network, ever dial pep-extauthz directly. A
  # retry after an escalation is approved goes straight to pdp-extauthz
  # instead (see that service's own comment) — decideRequestFromCheck
  # (extauthz.go) never reads an approval_id off an incoming CheckRequest,
  # by design (Task 3's own report: "the consuming side of a retry is a
  # direct-PDP-call concern the proto already supports without extauthz
  # needing new plumbing"), so there is no way to make Envoy carry one even
  # if this port were exposed.
  pep-extauthz:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pep
    # Dockerfile.pep's ENTRYPOINT is the bare binary with no subcommand
    # baked in — main.go dispatches on args[0] (main.go's own package doc) —
    # so the mode this container runs is a compose-level choice, here.
    command: ["extauthz"]
    depends_on:
      - pdp-extauthz
    environment:
      STRATIUM_PEP_EXTAUTHZ_LISTEN_ADDR: :9191
      STRATIUM_PEP_PDP_ADDR: pdp-extauthz:50051
      STRATIUM_PEP_AGENT_ID: 72d38ebe-2e5c-4918-9e73-b0de3607fbfa
      STRATIUM_PEP_SUBJECT: extauthz-integration@example.com
      STRATIUM_PEP_CONNECT_TIMEOUT: 5s
      # The authorities this surface serves (spec §4.7.2 K7, Phase 15). Envoy
      # reports the caller's own Host/:authority header, so without this list
      # a DPoP proof captured in flight to one gateway replays at any other
      # gateway the attacker can reach -- see matchAllowedHost's doc comment
      # in cmd/stratium-pep/extauthz.go. Required, no default: a deployment
      # that has not stated which hostnames it answers for cannot validate
      # the one component of htu that separates it from its neighbours.
      #
      # A stable name, NOT the host:port the integration suite dials. This
      # service's own port 10000 is published on an ephemeral host port
      # (see the envoy service's `ports:`), so the dialed address changes
      # every run and could never appear in a static list. That is not a test
      # workaround -- it is the ordinary deployment shape: an agent behind a
      # load balancer dials whatever address resolves and ADDRESSES a stable
      # public hostname, which is what lands in Host, what the surface
      # validates, and what the agent signs into htu.
      # extauthz_integration_test.go sets that Host explicitly and signs the
      # same value; extauthzPublicAuthority there is this string.
      STRATIUM_PEP_EXTAUTHZ_ALLOWED_HOSTS: envoy.stratium.test

  # The trivial upstream envoy's ALLOW path routes to — see
  # Dockerfile.echo-upstream and echo-upstream/main.go, both this directory.
  # Never published to the host: only envoy ever routes to it; the
  # integration test observes it exclusively through Envoy's own responses.
  echo-upstream:
    build:
      # This directory, not the repo root like every other build: unlike
      # stratium-pdp/stratium-pep, its Dockerfile needs nothing outside
      # deploy/docker/echo-upstream/, so there is no reason to hand it the
      # whole repo as build context.
      context: .
      dockerfile: Dockerfile.echo-upstream

  # A real Envoy, configured by envoy.yaml (this directory) with the
  # ext_authz HTTP filter pointed at pep-extauthz, in front of echo-upstream.
  # This is Task 4's whole reason to exist: every surface built in this
  # binary before extauthz was proven against the real thing it enforces —
  # hook and mcp against a real `claude` session — and a hand-driven Check
  # call (Tasks 1-3's own tests) proves the request/response MAPPING, not
  # that a real Envoy, which may normalize, add, or reorder headers a
  # constructed CheckRequest never would, actually drives it correctly.
  #
  # Image tag pinned to v1.37.0 to match go.mod's own
  # github.com/envoyproxy/go-control-plane/envoy version exactly — that
  # module is Envoy's own generated wire types for the ext_authz contract
  # this stack exercises for real (extauthz.go's own package doc,
  # DEPENDENCY), so running the Envoy release those types were generated
  # from is what makes this a same-version proof rather than a
  # close-enough one.
  envoy:
    image: envoyproxy/envoy:v1.37.0
    depends_on:
      - pep-extauthz
      - echo-upstream
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000"

  # Sixth PDP instance, wired for one purpose: Task 4's real-gRPC-service
  # proxy proof (services/internal/store/proxy_integration_test.go) needs a
  # PDP that is safe to seed cedar policies, delegations, tool_catalog rows,
  # and approvals into from a live gRPC call routed through a live
  # stratium-pep proxy -- exactly the same reason pdp-narrow, pdp-resource,
  # and pdp-extauthz above each exist instead of reusing pdp's own
  # tenant-one, restated a fourth time: tenant-one already carries
  # TestEndToEnd's own cedar policies and its own order-dependent proofs, and
  # none of pdp-narrow's, pdp-resource's, or pdp-extauthz's own tenants is
  # touched by anything outside their own one test file either. A fifth
  # tenant, touched by nothing but the proxy proof, is what makes that proof
  # reachable without an ordering dependency on any other test.
  #
  # Shares the same postgres instance as the PDPs above (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart). Full default policy-language
  # registry (STRATIUM_POLICY_LANGUAGES left unset), matching pdp,
  # pdp-resource, and pdp-extauthz: the proxy proof only ever needs cedar.
  pdp-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-proxy-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above -- same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # Seventh PDP instance, wired for one purpose: Phase 12 Task 3's live-stack
  # revocation-epoch proofs (services/internal/store/revocation_epoch_e2e_
  # integration_test.go) need real Decide() and CreateDelegation() calls,
  # over real gRPC, whose responses carry the epoch a future cache would
  # validate against -- but none of the PDP instances above can serve that
  # safely, for the identical reason pdp-resource's own comment already
  # gives at length: `pdp`'s tenant (tenant-one) already carries
  # TestEndToEnd's own cedar policies and its own order-dependent proofs,
  # and TestEndToEnd's own last subtest permanently revokes the serving
  # role's INSERT on audit_chain for the rest of that postgres instance's
  # life -- role-level, not tenant-scoped, so every OTHER PDP instance
  # sharing that role would go the same way the instant a live Decide() call
  # here happened to run after it.
  #
  # An eighth tenant alone is not sufficient here, unlike pdp-narrow's and
  # pdp-resource's own tenants (both consumed by tests declared INSIDE
  # store_integration_test.go, before TestEndToEnd in that file's own
  # declaration order, which protects them from the revoke without either
  # of their own comments having to say so) -- confirmed live: an earlier
  # version of the consuming test file used a dedicated tenant through THIS
  # service but was itself named to sort alphabetically after store_
  # integration_test.go (go test's cross-file order is filename order), and
  # every live-RPC proof in it still failed with "permission denied for
  # table audit_chain" once TestEndToEnd's own last subtest had already run.
  # The dedicated tenant here and that file's own name -- chosen to sort
  # BEFORE store_integration_test.go -- are both required together; this
  # service alone only closes the "shared, order-dependent tenant" half of
  # the problem pdp-resource's comment describes, not the "role-wide grant,
  # revoked once, for the rest of the process" half. catalog_integration_
  # test.go, escalation_integration_test.go, extauthz_integration_test.go,
  # and proxy_integration_test.go all already sort before store_integration_
  # test.go too, which is why none of their own PDP instances' comments
  # needed to name this constraint before now.
  #
  # Shares the same postgres instance as the PDPs above (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart). Full default policy-language
  # registry (STRATIUM_POLICY_LANGUAGES left unset), matching pdp,
  # pdp-resource, pdp-extauthz, and pdp-proxy: these proofs only ever need
  # cedar.
  pdp-epoch:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-epoch-e2e-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above -- same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # The real gRPC service Task 4's proxy proof puts stratium-pep proxy in
  # front of. Unlike echo-upstream (deploy/docker/echo-upstream/main.go,
  # deliberately outside the "stratium" module -- see its own Dockerfile),
  # this binary's source lives inside the module, at
  # services/cmd/grpc-target/main.go, because it imports the generated
  # internal/grpctarget package (proto/target/v1/target.proto) the
  # integration test also imports -- both sides need to share the identical
  # generated types. Built by Dockerfile.grpc-target, this directory.
  # Analogous to echo-upstream's role for Phase 10's real Envoy proof, but
  # genuinely typed gRPC end to end rather than plain HTTP -- see
  # target.proto's own package doc.
  #
  # Port published, unlike echo-upstream: proof 2 ("a denied call does not
  # reach the target") is checked against THIS service's own call counter
  # (its CallCount RPC), dialled directly by the test, never through the
  # proxy or the PDP -- the same "assert on the target's own counter, not
  # just what the caller observed" discipline proxy_test.go's own
  # contactCounter already established at the unit level (proxy.go's
  # package doc, DENY BY DEFAULT).
  grpc-target:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.grpc-target
    ports:
      - "50051"

  # stratium-pep, running in proxy mode: Task 4's own real-gRPC-service
  # proof. Built from Dockerfile.pep, the same image pep-extauthz already
  # uses -- that Dockerfile builds the whole binary with no subcommand baked
  # into the ENTRYPOINT, so which mode this container runs is this `command`
  # line alone, the identical pattern pep-extauthz's own comment documents.
  #
  # Published to the host, UNLIKE pep-extauthz: extauthz answers Envoy's own
  # ext_authz Check, one hop removed from any caller this test suite drives
  # directly, but proxy IS the process an agent's own gRPC client dials
  # AS ITS TARGET (proxy.go's own package doc: "transparent" means needing
  # no agent change, which only means something if a real caller can reach
  # this process the same way it would have reached grpc-target directly).
  # proxy_integration_test.go connects to this port the same way a real
  # caller would, not through a second hop the way extauthz's own proof goes
  # through envoy.
  #
  # AgentID/Subject are fixed compose-time constants for the same reason
  # pep-extauthz's own comment gives: proxy.go's own package doc (NO SESSION
  # FILE) means the identity behind every Decide call this process makes is
  # its own startup configuration, never read off a request -- so
  # proxy_integration_test.go hardcodes the identical two values as Go
  # constants, matching this file exactly, the same convention
  # extauthz_integration_test.go's own extauthzAgentID/extauthzSubject
  # already established. The agent id has no special meaning; it was
  # generated once with no committed key or secret behind it.
  #
  # ApprovalPollInterval/ApprovalTimeout are proxy-only settings (proxyConfig,
  # proxy.go) neither pdp-extauthz-fronting service needs: proxy, unlike
  # extauthz, is a BLOCKING surface (spec §4.6) -- it holds a caller's own
  # stream open across an escalation instead of degrading to a denial (see
  # proxy.go's own package doc, ESCALATE BLOCKS). The poll interval is short
  # and the timeout generous so proof 5's own out-of-band approval -- issued
  # by the test itself, against real Postgres, while the call is still
  # blocked -- has ample time to land before the timeout would otherwise
  # fire and turn that proof into a flake.
  pep-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pep
    command: ["proxy"]
    depends_on:
      - pdp-proxy
      - grpc-target
    environment:
      STRATIUM_PEP_PROXY_LISTEN_ADDR: :9292
      STRATIUM_PEP_PROXY_TARGET_ADDR: grpc-target:50051
      STRATIUM_PEP_PDP_ADDR: pdp-proxy:50051
      STRATIUM_PEP_AGENT_ID: 04ef809a-849f-404a-9a5c-015b7f73a014
      STRATIUM_PEP_SUBJECT: proxy-integration@example.com
      STRATIUM_PEP_CONNECT_TIMEOUT: 5s
      STRATIUM_PEP_APPROVAL_POLL_INTERVAL: 200ms
      STRATIUM_PEP_APPROVAL_TIMEOUT: 30s
    ports:
      - "9292"

  # Eighth PDP instance, wired for one purpose: Task 4's live-stack decision-
  # cache proofs (services/internal/store/cache_e2e_integration_test.go) need
  # a PDP that is safe to seed cedar policies and delegations into -- the same
  # reason pdp-narrow, pdp-resource, pdp-extauthz, pdp-proxy, and pdp-epoch
  # above each exist instead of reusing pdp's own tenant-one, restated again:
  # tenant-one already carries TestEndToEnd's own cedar policies and its own
  # order-dependent proofs, including a permanent, role-level revoke of
  # stratium_app's INSERT on audit_chain that would break every later live
  # Decide/CreateDelegation call on ANY tenant sharing that role, this one
  # included. None of the five dedicated tenants above is touched by anything
  # outside their own one test file either. Another dedicated tenant, touched
  # by nothing but the cache proofs, is what makes them reachable without an
  # ordering dependency on any other test.
  #
  # This is also the FIRST PDP instance in the whole stack any test is ever
  # allowed to stop mid-run: proofs 2, 3, 5, and 6 in that test file need the
  # PDP genuinely unreachable, not a bad address standing in for one (the
  # task brief's own requirement), and a real `docker compose stop pdp-cache`
  # is how they get that -- see that file's own package doc. Every one of the
  # eight PDP instances above stays up for the whole suite specifically
  # because OTHER tests assume it is; this one is dedicated to a test file
  # written to expect it disappearing on purpose.
  #
  # Shares the same postgres instance as the PDPs above (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart). Full default policy-language
  # registry (STRATIUM_POLICY_LANGUAGES left unset), matching pdp,
  # pdp-resource, pdp-extauthz, pdp-proxy, and pdp-epoch: these proofs only
  # ever need cedar.
  pdp-cache:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-cache-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above -- same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # A REAL IdP, and the first component in this stack that authenticates a
  # human. Phase 14 Task 8's proofs need one because N2 (spec §8) leaves
  # exactly one way for an operator to reach the admin plane -- OIDC against
  # a real provider, with no fallback of any kind, not even "for the test
  # stack" -- so a hand-rolled token issuer here would be inventing the very
  # claim shapes these proofs exist to discover. Every other surface in this
  # project was proven against the real thing it fronts (a real `claude`
  # session, a real Envoy, a real gRPC service), and each such run found
  # something no constructed fixture had: Task 6's own fix round was a real
  # IdP's token endpoint sitting on a DIFFERENT ORIGIN from its issuer,
  # which broke the admin UI's Content-Security-Policy and which no
  # hand-built test had suggested was possible.
  #
  # Keycloak, not Dex, which was Task 8's stated intent. One concrete reason:
  # STRATIUM_PAP_ROLE_CLAIM must resolve to an ARRAY here. resolveRole
  # (cmd/stratium-pap/role.go) accepts a string claim or a []any claim, and
  # only the array branch carries highest-role-wins -- among an operator's
  # matching groups the highest-ranked role is taken, which is the branch
  # every real deployment uses and the one where a wrong answer silently
  # OVER-privileges an operator rather than locking them out. Dex cannot
  # produce that shape without a second backing service: its staticPasswords
  # carry no groups at all (storage.Password is Email/Hash/Username/UserID),
  # and its only groups-bearing connector that needs no external directory,
  # mockCallback, returns a single hardcoded identity in a single group --
  # enough for neither three roles nor an operator in two mapped groups. The
  # remaining Dex route was an LDAP connector plus an OpenLDAP container and
  # a bootstrap LDIF (two services, a second schema to get right); Keycloak
  # is one service and one realm document. Task 8's brief names Keycloak
  # explicitly as the sanctioned heavier alternative.
  #
  # start-dev, not start: this is an ephemeral, in-memory-database IdP for a
  # test stack, torn down with the rest of it. --import-realm reads the
  # single realm document mounted below, once, at first boot.
  #
  # The realm sets frontendUrl = http://keycloak:8080 (an attribute in
  # stratium-realm.json, not a KC_HOSTNAME environment variable). That is
  # load-bearing and not cosmetic. Without it Keycloak derives the issuer
  # from each request's own Host header, so a token the integration test
  # fetches from localhost:<published port> would carry
  # iss=http://localhost:<port>/realms/stratium while stratium-pap, which
  # reaches the same Keycloak over the compose network, is configured for
  # http://keycloak:8080/realms/stratium -- and go-oidc would reject every
  # such token on the issuer check alone. Pinning it in the realm rather
  # than via KC_HOSTNAME keeps Keycloak willing to SERVE requests arriving
  # under any Host (the test's own localhost:<port> included) while still
  # issuing, and advertising in discovery, the one issuer the PAP trusts.
  #
  # Health is checked against the realm's own discovery document rather than
  # KC_HEALTH_ENABLED's /health/ready, because that is the condition the two
  # PAP services below actually depend on: they perform OIDC discovery at
  # startup (cmd/stratium-pap/main.go's run, before serving) and fail to
  # start at all if it does not answer, so "the process is up" is the wrong
  # question and "this realm is imported and serving discovery" is the right
  # one. The image has neither curl nor wget, but /bin/sh is bash, so bash's
  # own /dev/tcp is the available HTTP client (verified against this exact
  # image, not assumed).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak_admin_local_dev_only
    volumes:
      - ./keycloak/stratium-realm.json:/opt/keycloak/data/import/stratium-realm.json:ro
    ports:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/stratium/.well-known/openid-configuration HTTP/1.1\r\nHost: keycloak:8080\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"issuer"' <&3
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Ninth PDP instance, and the decision-plane half of Task 8's live admin-
  # plane proofs: the PDP whose Decide calls must OBSERVE what an operator
  # wrote through stratium-pap below. Its own tenant, for the reason every
  # dedicated PDP above states and this one states most sharply -- these
  # proofs do not merely read shared state, they CREATE policies, revoke
  # delegations, and write tier overrides, every one of which bumps
  # tenant_epoch (migrations/000015_tenant_epoch_trigger). A test sharing
  # this tenant would have its own epoch assertions moved under it by a
  # write it never made.
  #
  # Shares the same postgres instance as every PDP above (RLS keyed on
  # STRATIUM_TENANT_ID keeps tenants apart) and the full default policy-
  # language registry: these proofs only ever need cedar.
  pdp-pap:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATIUM_MIGRATION_DATABASE_URL: postgres://stratium_migrate:stratium_migrate_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_DATABASE_URL: postgres://stratium:stratium_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_TENANT_ID: tenant-pap-e2e-integration
      STRATIUM_LISTEN_ADDR: :50051
      # See the "pdp" service's own comment on this variable above -- same
      # build-time-generated key, same path, same reason.
      STRATIUM_TOKEN_SIGNING_KEY_PATH: /etc/stratium/keys/current.pem
      # See the "pdp" service's own comment on this variable above -- K9
      # makes it required, so every PDP service sets one.
      STRATIUM_DPOP_FRESHNESS_WINDOW: 30s
    ports:
      - "50051"

  # The admin plane itself, live, for the first time: the most privileged
  # component in this system and the only internet-facing one, holding
  # exactly the write credentials the PDP is denied (spec §4.10, N3). Built
  # from Dockerfile.pap -- see that file for why the admin UI must already be
  # built on the host before this image can be.
  #
  # Connects as stratium_pap_login (deploy/docker/init-db.sql;
  # migrations/000016_stratium_pap_role), NEVER as "stratium". The two roles
  # are disjoint by design: this one holds INSERT/UPDATE/DELETE on the six
  # governed tables, the PDP's holds SELECT and nothing more on
  # tier_overrides/approvals/tool_catalog, and those ABSENT grants are what
  # E7, T1, and T6 actually rest on.
  #
  # Every required value below has no default, deliberately (config.go's own
  # doc comment): a missing one fails at startup naming every missing key at
  # once, rather than being guessed. STRATIUM_PAP_ROLE_CLAIM names "groups"
  # -- the array claim keycloak's realm mapper emits -- and not "email",
  # which would exercise resolveRole's string branch and leave production's
  # actual shape unproven. The three group lists map the realm's own group
  # names; VIEWER_GROUPS deliberately holds TWO, so that "all-staff"
  # (viewer) sitting alongside "stratium-admins" (admin) on the pap-multi
  # operator makes highest-role-wins actually run rather than being a branch
  # nothing reaches.
  #
  # STRATIUM_PAP_APPROVER_CLAIM is "email", a SECOND and independently
  # configured claim from the role claim (N8) because it answers a different
  # question: N7 compares it against an approval's own root_principal, which
  # a PEP populates from its STRATIUM_PEP_SUBJECT configuration (an email in
  # practice), and an IdP's opaque "sub" was never going to match that.
  # role.go's resolveApproverIdentity additionally requires email_verified
  # to be true when the claim is literally named "email"; the realm's users
  # are all emailVerified, so that gate passes for real rather than being
  # bypassed.
  stratium-pap:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pap
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      STRATIUM_PAP_TENANT_ID: tenant-pap-e2e-integration
      STRATIUM_PAP_DATABASE_URL: postgres://stratium_pap_login:stratium_pap_login_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_PAP_OIDC_ISSUER: http://keycloak:8080/realms/stratium
      STRATIUM_PAP_OIDC_AUDIENCE: stratium-pap
      STRATIUM_PAP_OIDC_CLIENT_ID: stratium-pap
      STRATIUM_PAP_ROLE_CLAIM: groups
      STRATIUM_PAP_APPROVER_CLAIM: email
      STRATIUM_PAP_ADMIN_GROUPS: stratium-admins
      STRATIUM_PAP_EDITOR_GROUPS: stratium-editors
      STRATIUM_PAP_VIEWER_GROUPS: stratium-viewers,all-staff
      STRATIUM_PAP_LISTEN_ADDR: :8080
    ports:
      - "8080"

  # A SECOND stratium-pap, on the extauthz proof's own tenant. Not
  # redundancy: N1 makes the tenant startup configuration and forbids any
  # request from carrying one, so a PAP process serves exactly one tenant
  # for its whole life. Task 8's proof 4 approves an escalation that a real
  # Envoy -> pep-extauthz -> pdp-extauthz round trip created, and that
  # approval row lives in tenant-extauthz-integration; the stratium-pap
  # service above, fixed to tenant-pap-e2e-integration, cannot see it, and
  # widening it to could only be done by breaking N1. A second process is
  # the only shape this system permits.
  #
  # Safe to point at a tenant another test owns, unlike the write-heavy
  # proofs above, because of what an approval write does NOT do:
  # migrations/000015_tenant_epoch_trigger names policies, agents,
  # tool_catalog, and tier_overrides (every operation) plus delegations
  # (UPDATE/DELETE), and approvals is absent from that list -- deciding an
  # approval bumps no epoch. The only row it touches is the one the extauthz
  # proof itself created moments earlier and is waiting to resolve.
  #
  # Same Keycloak, same client, same operators. The user whose email is
  # extauthz-integration@example.com exists in the realm specifically for
  # this service: it must equal pep-extauthz's own STRATIUM_PEP_SUBJECT
  # above, because that value is what the PDP records as the escalation's
  # root_principal and what N7 requires the approving operator's own
  # identity to equal.
  pap-extauthz:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pap
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      STRATIUM_PAP_TENANT_ID: tenant-extauthz-integration
      STRATIUM_PAP_DATABASE_URL: postgres://stratium_pap_login:stratium_pap_login_local_dev_only@postgres:5432/stratium?sslmode=disable
      STRATIUM_PAP_OIDC_ISSUER: http://keycloak:8080/realms/stratium
      STRATIUM_PAP_OIDC_AUDIENCE: stratium-pap
      STRATIUM_PAP_OIDC_CLIENT_ID: stratium-pap
      STRATIUM_PAP_ROLE_CLAIM: groups
      STRATIUM_PAP_APPROVER_CLAIM: email
      STRATIUM_PAP_ADMIN_GROUPS: stratium-admins
      STRATIUM_PAP_EDITOR_GROUPS: stratium-editors
      STRATIUM_PAP_VIEWER_GROUPS: stratium-viewers,all-staff
      STRATIUM_PAP_LISTEN_ADDR: :8080
    ports:
      - "8080"

volumes:
  pgdata:
