# Editing this file and running `docker compose up -d envoy --wait` does NOT
# reload it: this config is bind-mounted, compose won't recreate a service
# whose definition is unchanged, and Envoy only reads its bootstrap at
# process start -- use `docker compose up -d --force-recreate envoy --wait`
# (or `restart envoy`) or you'll get a healthy container still serving the
# old routes.
#
# Static bootstrap for Task 4's real-Envoy proof: one HTTP listener with the
# ext_authz filter pointed at stratium-pep's extauthz mode (the pep-extauthz
# compose service), in front of a trivial echo upstream (the echo-upstream
# compose service). docker-compose.yml's own comment on the envoy service
# explains why this stack exists at all; services/internal/store/
# extauthz_integration_test.go is what actually drives requests at the
# listener below and checks what comes back.
#
# This file is also what the user guide points to as the worked example, so
# it carries the limits a listener in front of stratium-pep should have. Each
# is commented where it is set; the numbers are starting points, not advice
# for your traffic. What it leaves out is at the end of this comment.
#
# generate_request_id is off, and the one route's timeout is disabled,
# deliberately, together: extauthz_integration_test.go reconstructs the exact
# raw_input JSON stratium-pep hashed into the audit chain (proof 6) and
# reuses that reconstruction, unchanged, as the RawInput of a direct retry
# Decide call after an escalated request is approved out of band (proof 5).
# Both need the header set Envoy hands to ext_authz to be a deterministic
# function of what the test's own HTTP client sent -- a random per-request
# x-request-id or a router-injected x-envoy-expected-rq-timeout-ms header
# would otherwise land in that JSON and make the reconstruction (and the
# retry's own input-digest match against the pending approval,
# models.Approval.Verify) depend on timing the test does not control.
#
# So a request is bounded here without a route timeout: by the connection
# manager's max_stream_duration, stream_idle_timeout and request_timeout
# below, none of which adds a header. In a deployment with no such test, a
# route `timeout` is the more usual way and can replace `timeout: 0s`.
#
# Left out, because each depends on the deployment:
#   - TLS on the listener. This one is plain HTTP for the test's sake.
#   - use_remote_address / xff_num_trusted_hops, which decide what Envoy
#     believes a client's address is. Set them before limiting per client.
#   - A limit per client. The local rate limit below is one bucket for the
#     whole listener: it protects stratium-pep and the PDP from a flood, and
#     it does not stop one client using all of it. Per-client limits need
#     descriptors on that filter, or the global rate limit service.
#   - Binding the admin interface to localhost. It is on every interface here
#     only so the compose stack can reach it.

# Refuses new connections once this many are open, whatever the listener.
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 10000

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: extauthz_proof_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      # How much Envoy buffers for one connection before it stops reading.
      per_connection_buffer_limit_bytes: 32768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: extauthz_proof
                generate_request_id: false
                # A client has this long to send its headers, and this long
                # to send the whole request.
                request_headers_timeout: 10s
                request_timeout: 60s
                # A stream on which nothing moves in either direction for
                # this long is reset. Kept long because an LLM completion on
                # the /chat/completions route can sit silent while it works.
                stream_idle_timeout: 300s
                common_http_protocol_options:
                  # A connection with no stream on it is closed after this.
                  idle_timeout: 300s
                  # The longest any one request may take, start to finish.
                  # This is what bounds a request in place of the route
                  # timeout this file cannot use (see the top).
                  max_stream_duration: 300s
                http2_protocol_options:
                  # One client connection may carry this many requests at
                  # once. Envoy's own default is effectively no limit.
                  max_concurrent_streams: 100
                  initial_stream_window_size: 65536
                  initial_connection_window_size: 1048576
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # Matched before the "/" catch-all below (Envoy
                        # takes the first matching route): the PEP examples'
                        # LiteLLM route, added for Task 4. Same ext_authz
                        # filter, same PDP decision, gating which model an
                        # agent may reach -- the litellm compose service's
                        # own comment explains the two declared models.
                        - match: { prefix: "/chat/completions" }
                          route:
                            cluster: litellm
                            timeout: 0s
                        - match: { prefix: "/" }
                          route:
                            cluster: echo_upstream
                            timeout: 0s
                http_filters:
                  # Before ext_authz, so a flood is turned away with a 429
                  # here and never becomes a Check call to stratium-pep or a
                  # Decide call to the PDP. One bucket for the listener: 100
                  # requests a second, 200 at once.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: listener_rate_limit
                      token_bucket:
                        max_tokens: 200
                        tokens_per_fill: 100
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: listener_rate_limit_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        runtime_key: listener_rate_limit_enforced
                        default_value: { numerator: 100, denominator: HUNDRED }
                  # ext_authz first: every request is checked before the
                  # router ever sees it. failure_mode_allow is set to false
                  # explicitly, matching the brief's "fail closed everywhere"
                  # constraint at the Envoy layer specifically -- it governs
                  # what Envoy does if THIS PROCESS (pep-extauthz) is
                  # unreachable, a different failure point from stratium-pep
                  # extauthz's own handling of an unreachable PDP behind it
                  # (extauthz.go's package doc, FAIL CLOSED), which already
                  # denies as an ordinary CheckResponse rather than a
                  # transport error. false is already Envoy's own default;
                  # named here anyway, the same "no default trusted silently"
                  # convention every STRATIUM_* config value in this repo
                  # already follows.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc:
                          cluster_name: ext_authz_pep
                        timeout: 5s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ext_authz_pep: stratium-pep extauthz. HTTP/2 (cleartext) is required
    # explicitly -- Go's grpc-go server (what stratium-pep extauthz's own
    # grpc.NewServer() speaks, over plain net.Listen with no TLS) only ever
    # answers h2c, and Envoy's own cluster default is HTTP/1.1, which cannot
    # carry a gRPC call at all.
    - name: ext_authz_pep
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      # What Envoy will have outstanding to this cluster at once. Past these
      # it fails a request at once instead of queueing it.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 16
            max_pending_requests: 200
            max_requests: 200
            max_retries: 3
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ext_authz_pep
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: pep-extauthz, port_value: 9191 }

    # echo_upstream: the trivial upstream. Plain HTTP/1.1 -- Envoy's default
    # protocol -- since echo-upstream is an ordinary net/http server.
    - name: echo_upstream
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      # What Envoy will have outstanding to this cluster at once. Past these
      # it fails a request at once instead of queueing it.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100
            max_retries: 3
      load_assignment:
        cluster_name: echo_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: echo-upstream, port_value: 8080 }

    # litellm: the PEP examples' LLM gateway (Task 4). Plain HTTP/1.1 --
    # Envoy's default protocol -- since LiteLLM's proxy is an ordinary HTTP
    # server, same as echo_upstream above.
    - name: litellm
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      # What Envoy will have outstanding to this cluster at once. Past these
      # it fails a request at once instead of queueing it.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100
            max_retries: 3
      load_assignment:
        cluster_name: litellm
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: litellm, port_value: 4000 }
